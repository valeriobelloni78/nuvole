it: {
  "g.titolo": "Guida",
  "g.torna": "Torna allo strumento",
  "g.intro": "Nuvole è una web-app di musica generativa che gira interamente nel browser. Un cielo di puntini attraversato da nuvole lente, e un insieme di voci che le nuvole chiamano a suonare. Non c'è nessuna registrazione: quello che si ascolta si forma mentre lo si ascolta, e non si ripete.",

  "g.h.cielo": "Il cielo",
  "g.cielo.1": "La finestra non contiene nuvole disegnate: contiene un campo continuo di rumore, interrogato in ogni punto di una matrice fitta. Dove il campo supera una soglia c'è nuvola, e il puntino sbianca e cresce; sotto quella soglia il puntino ha esattamente il colore del cielo, e perciò non si vede. La matrice c'è tutta, sempre — appare soltanto dove la nuvola la scopre.",
  "g.cielo.2": "Il campo non si muove: si sposta il punto da cui lo si guarda, ed è il vento. Una seconda scala, molto più lenta, decide dove il cielo si addensa e dove resta limpido. Per questo le nuvole non si ripetono mai: nascono, attraversano e si sciolgono ai bordi.",

  "g.h.suono": "Il suono",
  "g.suono.1": "Il motore sonoro è nella scia di <em>In C</em> di Terry Riley (1964): un archivio di frasi brevissime che più voci leggono ciascuna per conto proprio, sopra un polso comune. Le 53 frasi di Nuvole sono materiale originale, non le cellule di Riley — se ne adotta il principio, non le note.",
  "g.suono.2": "A decidere quando si suona sono le nuvole. La finestra è divisa in bande verticali, una per voce: quando una nuvola entra in una banda, quella voce si sveglia, prende una delle frasi disponibili in quel momento e la ripete; quando la nuvola esce, finisce la lettura e tace. Poiché le bande sono attraversate in momenti diversi e per durate diverse, nessuna sovrapposizione è scritta da qualche parte: si formano e si sciolgono come le nuvole che le hanno chiamate.",
  "g.suono.3": "Ne segue che Cielo sereno è anche il comando del silenzio: un cielo limpido è quasi muto, un cielo coperto è un insieme fitto.",

  "g.h.arco": "L'arco",
  "g.arco.1": "L'insieme avanza nell'archivio di una frase per volta, mai a salti, e non lascia indietro nessuno: il fronte aspetta chi sta ancora leggendo. Così l'armonia deriva per gradi lungo dieci tratti, che il quadrante chiama con i nomi del cielo.",
  "g.arco.2": "Dopo l'ultimo si ricomincia dal primo: l'arco si richiude dove è cominciato.",

  "arco.6": "la tensione, il movimento",
  "arco.7": "il cielo si svuota",
  "arco.8": "l'ombra",
  "arco.9": "l'ombra si ritira",
  "arco.10": "la luce torna, e l'arco si chiude",

  "g.h.strumenti": "Gli strumenti",
  "g.strumenti.1": "I timbri sono quattro, e a scegliere è ancora la nuvola: lo spessore che ha sulla banda decide con quale voce suonare, dal velo sottile alla nuvola piena.",
  "g.strumenti.2": "Si possono tenere accesi tutti e quattro, oppure due, oppure uno solo — e allora l'insieme intero suona con quello.",

  "s.onda": "un suono semplice e tenuto, il fondo dell'insieme",

  "d.sereno": "quanta parte del cielo resta limpida: alzandolo le nuvole diradano, ed è anche il comando del silenzio",

fr: {
  "g.titolo": "Guide",
  "g.torna": "Retour à l'instrument",
  "g.intro": "Nuvole est une application web de musique générative qui fonctionne entièrement dans le navigateur. Un ciel de points traversé par des nuages lents, et un ensemble de voix que les nuages appellent à jouer. Il n'y a aucun enregistrement : ce que l'on écoute se forme pendant qu'on l'écoute, et ne se répète pas.",

  "g.h.cielo": "Le ciel",
  "g.cielo.1": "La fenêtre ne contient pas de nuages dessinés : elle contient un champ continu de bruit, interrogé en chaque point d'une trame serrée. Là où le champ dépasse un seuil il y a nuage, et le point blanchit et grandit ; sous ce seuil le point a exactement la couleur du ciel, et donc ne se voit pas. La trame est là tout entière, toujours — elle n'apparaît que là où le nuage la découvre.",
  "g.cielo.2": "Le champ ne bouge pas : c'est le point d'où on le regarde qui se déplace, et c'est le vent. Une seconde échelle, bien plus lente, décide où le ciel s'épaissit et où il reste limpide. C'est pourquoi les nuages ne se répètent jamais : ils naissent, traversent et se dissolvent aux bords.",

  "g.h.suono": "Le son",
  "g.suono.1": "Le moteur sonore est dans le sillage d'<em>In C</em> de Terry Riley (1964) : un répertoire de phrases très brèves que plusieurs voix lisent chacune pour son compte, sur une pulsation commune. Les 53 phrases de Nuvole sont un matériau original, non les cellules de Riley — on en adopte le principe, pas les notes.",
  "g.suono.2": "Ce sont les nuages qui décident du moment. La fenêtre est divisée en bandes verticales, une par voix : quand un nuage entre dans une bande, cette voix s'éveille, prend l'une des phrases alors disponibles et la répète ; quand le nuage sort, elle achève sa lecture et se tait. Comme les bandes sont traversées à des moments et pour des durées différentes, aucune superposition n'est écrite nulle part : elles se forment et se défont comme les nuages qui les ont appelées.",
  "g.suono.3": "Il s'ensuit que Ciel dégagé est aussi la commande du silence : un ciel limpide est presque muet, un ciel couvert est un ensemble dense.",

  "g.arco.1": "L'ensemble avance dans le répertoire d'une phrase à la fois, jamais par sauts, et ne laisse personne en arrière : le front attend celui qui lit encore. Ainsi l'harmonie dérive par degrés le long de dix étapes, que le cadran nomme avec les mots du ciel.",
  "g.arco.2": "Après la dernière on reprend la première : l'arc se referme là où il a commencé.",
  "arco.1": "trois sons seulement, la pleine lumière",
  "arco.2": "l'air s'ouvre",
  "arco.3": "le premier poids",
  "arco.4": "une éclaircie avant le changement",
  "arco.5": "l'étape la plus lumineuse",
  "arco.6": "la tension, le mouvement",
  "arco.7": "le ciel se vide",
  "arco.8": "l'ombre",
  "arco.9": "l'ombre se retire",
  "arco.10": "la lumière revient, et l'arc se referme",

  "g.h.strumenti": "Les instruments",
  "g.strumenti.1": "Les timbres sont quatre, et c'est encore le nuage qui choisit : l'épaisseur qu'il a sur la bande décide de la voix, du voile mince au nuage plein.",
  "g.strumenti.2": "On peut en garder les quatre allumés, ou deux, ou un seul — et alors l'ensemble entier joue avec celui-là.",
  "s.vetro": "un glockenspiel : l'attaque entre brillante et s'éclaircit aussitôt en un son pur qui continue de sonner",
  "s.legno": "une mailloche sur lame de marimba, chaude et brève",
  "s.onda": "un son simple et tenu, le fond de l'ensemble",
  "s.soffio": "un souffle : bruit filtré étroit autour de la note, avec une sinusoïde dessous qui lui donne la hauteur",

en: {
  "g.titolo": "Guide",
  "g.torna": "Back to the instrument",
  "g.intro": "Nuvole is a generative-music web app that runs entirely in the browser. A sky of dots crossed by slow clouds, and an ensemble of voices that the clouds call into playing. There is no recording: what you hear forms while you listen to it, and never repeats.",

  "g.h.cielo": "The sky",
  "g.cielo.1": "The window holds no drawn clouds: it holds a continuous field of noise, questioned at every point of a fine matrix. Where the field crosses a threshold there is cloud, and the dot whitens and grows; below that threshold the dot is exactly the colour of the sky, and so cannot be seen. The matrix is there in full, always — it appears only where the cloud uncovers it.",
  "g.cielo.2": "The field does not move: what moves is the point from which it is read, and that is the wind. A second scale, far slower, decides where the sky thickens and where it stays clear. This is why the clouds never repeat: they form, cross, and dissolve at the edges.",

  "g.h.suono": "The sound",
  "g.suono.1": "The sound engine follows in the wake of Terry Riley's <em>In C</em> (1964): an archive of very short phrases that several voices each read on their own, over a shared pulse. The 53 phrases of Nuvole are original material, not Riley's cells — the principle is adopted, not the notes.",
  "g.suono.2": "It is the clouds that decide when to play. The window is divided into vertical bands, one per voice: when a cloud enters a band, that voice wakes, takes one of the phrases available at that moment and repeats it; when the cloud leaves, it finishes its reading and falls silent. Because the bands are crossed at different moments and for different durations, no overlap is written down anywhere: they form and dissolve like the clouds that called them.",
  "g.suono.3": "It follows that Clear sky is also the control of silence: a clear sky is nearly mute, an overcast one a dense ensemble.",

  "g.h.arco": "The arc",
  "g.arco.1": "The ensemble moves through the archive one phrase at a time, never skipping, and leaves no one behind: the front waits for whoever is still reading. So the harmony drifts by degrees along ten stretches, which the dial names with the words of the sky.",
  "g.arco.2": "After the last one it begins again from the first: the arc closes where it started.",
  "arco.1": "three notes only, full light",
  "arco.2": "the air opens",
  "arco.3": "the first weight",
  "arco.4": "a clearing before the change",
  "arco.5": "the brightest stretch",
  "arco.6": "tension, movement",
  "arco.7": "the sky empties",
  "arco.8": "the shadow",
  "arco.9": "the shadow withdraws",
  "arco.10": "the light returns, and the arc closes",

  "g.h.strumenti": "The instruments",
  "g.strumenti.1": "There are four timbres, and again it is the cloud that chooses: its thickness over the band decides which voice sounds, from thin veil to full cloud.",
  "g.strumenti.2": "You can keep all four on, or two, or only one — and then the whole ensemble plays with that one.",
  "s.vetro": "a glockenspiel: the stroke enters bright and clears at once into a pure tone that keeps ringing",
  "s.legno": "a mallet on a marimba bar, warm and short",
  "s.onda": "a plain sustained tone, the ground of the ensemble",
  "s.soffio": "a breath: noise filtered narrowly around the note, with a sine beneath giving it pitch",

  "g.h.comandi": "The controls",
  "g.comandi.1": "The panel sits below the window, in two sections. Above it a ruler shows the bands of the voices — the one a cloud is crossing lights up, with the phrase number and the instrument's initial — and a dial reports the phrase of the ensemble, the voices listening, and the stretch of the arc.",

  "d.registro": "the transposition of the whole, in semitones",

/* --- scelta e applicazione della lingua ------------------------------------ */
const CHIAVE_LINGUA = "nuvole.lang";
function lingueSalvata() {
  try { return localStorage.getItem(CHIAVE_LINGUA); } catch (e) { return null; }
}
function salvaLingua(v) {
  try { localStorage.setItem(CHIAVE_LINGUA, v); } catch (e) {}
}
function scegliLingua() {
  let q = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  if (LINGUE.includes(q)) return q;
  const salvata = lingueSalvata();
  if (LINGUE.includes(salvata)) return salvata;
  const pref = (navigator.languages && navigator.languages.length)
             ? navigator.languages : [navigator.language || ""];
  for (const tag of pref) {
    const primaria = String(tag).toLowerCase().split("-")[0];
    if (primaria === "it" || primaria === "fr" || primaria === "ja") return primaria;
  }
  return "en";
}
let lingua = scegliLingua();
function T(chiave) {
  const d = TESTI[lingua] || TESTI.en;
  return (chiave in d) ? d[chiave] : (TESTI.en[chiave] || chiave);
}

function elenco(id, righe) {
  const dl = document.getElementById(id);
  dl.innerHTML = "";
  righe.forEach(([titolo, testo]) => {
    const dt = document.createElement("dt"); dt.textContent = titolo;
    const dd = document.createElement("dd"); dd.textContent = testo;
    dl.appendChild(dt); dl.appendChild(dd);
  });
}

function applicaLingua() {
  document.documentElement.lang = lingua;
  document.title = "Nuvole · " + T("g.titolo");

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = T(el.getAttribute("data-i18n"));
  });
  /* Due attributi, non uno: `data-i18n` scrive testo semplice, `data-i18n-html`
     accetta il risalto interno (**grassetto** e *corsivo* nel file dei testi)
     di cui la prosa della guida ha bisogno. Le stringhe vengono da questo file,
     non da fuori. */
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = T(el.getAttribute("data-i18n-html"));
  });

  elenco("arcoElenco", NOMI_REGIONI[lingua].map((n, i) => [n, T("arco." + (i + 1))]));
  elenco("strumentiElenco", NOMI_STRUMENTI[lingua].map((n, i) => [n, T(CHIAVI_STRUMENTI[i])]));
  const nc = NOMI_COMANDI[lingua];
  elenco("comandiCielo", COMANDI_CIELO.map(([c, d]) => [nc[c], T(d)]));
  elenco("comandiSuono", COMANDI_SUONO.map(([c, d]) => [nc[c], T(d)]));

  const nav = document.getElementById("lingue");
  nav.setAttribute("aria-label", T("ui.lingua") || "Lingua");
  nav.querySelectorAll("button").forEach((b) => {
    const scelta = b.dataset.lang === lingua;
    b.classList.toggle("scelta", scelta);
    b.setAttribute("aria-pressed", scelta ? "true" : "false");
  });
  document.getElementById("torna").setAttribute("href", "index.html?lang=" + lingua);
}

function cambiaLingua(l) {
  if (!LINGUE.includes(l) || l === lingua) return;
  lingua = l;
  salvaLingua(l);
  applicaLingua();
}

(function costruisciLingue() {
  const cont = document.getElementById("lingue");
  LINGUE.forEach((l) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.lang = l;
    b.textContent = SIGLA_LINGUA[l];
    b.addEventListener("click", () => cambiaLingua(l));
    cont.appendChild(b);
  });
  applicaLingua();
})();
