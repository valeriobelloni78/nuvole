<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }
  body {
    /* Il fondo è ESATTAMENTE il colore dei puntini di cielo sereno, e piatto:
       così la matrice c'è ma non si vede, e affiorano solo i puntini bianchi
       delle nuvole. Un gradiente, anche lieve, la farebbe riapparire. */
    background: #5e9bc9;
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 5vw;
    min-height: 100vh;
  }

  /* La stanza: colonna allineata a sinistra */
  .stanza {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(14px, 2.2vh, 24px);
  }

  /* Tutta la parte tecnica è monospaziata: etichette, valori, quadranti. */
  .tecnico {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* Testata: due righe separate dal filo. Sopra il marchio e le lingue,
     sotto la sigla dell'opera e il rimando alla guida. */
  .testata { display: flex; flex-direction: column; gap: 9px; }
  .testata .riga {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
  }
  .testata .filo { height: 1px; background: rgba(255, 255, 255, 0.38); }

  .lingue { display: flex; gap: 14px; }
  .lingue button {
    font: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .lingue button:hover { color: rgba(255, 255, 255, 0.9); }
  .lingue button.scelta { color: #ffffff; }
  .lingue button:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }

  .guida {
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.45);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .guida:hover { color: #ffffff; border-color: #ffffff; }
  .marchio {
    font-weight: 300;
    letter-spacing: 0.5em;
    font-size: 13px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.95);
  }
  /* Il punto che respira accanto al marchio, come in Rada2. Il respiro dura
     quattro battiti del polso: a 44 bpm sono 5,45 s. */
  .marchio .punto {
    display: inline-block;
    width: 0.30em; height: 0.30em;
    border-radius: 50%;
    background: #ffffff;
    vertical-align: 0.20em;
    /* il letter-spacing (0.5em) separa i caratteri ma non lascia nulla dopo un
       blocco in linea: il margine è la sola distanza fra la "e" e il punto, e
       va aggiunto a quello. Qui il punto sta staccato dalla parola, non le si
       appoggia come un segno d'interpunzione. */
    margin-left: 0.32em;
    animation: respiro 5.45s ease-in-out infinite;
  }
  @keyframes respiro {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marchio .punto { animation: none; opacity: 0.85; }
  }
  .sigla { color: rgba(255, 255, 255, 0.7); }
  html[lang="ja"] .tecnico { letter-spacing: 0.08em; }

  /* La finestra: solo vetro, nessuna cornice */
  /* La finestra: un contorno finissimo, il solo segno che la incornicia */
  .finestra {
    line-height: 0;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }
  #cielo { display: block; width: 100%; }

  /* Righello delle bande: una casella per voce, il numero della frase che
     sta leggendo. È il riscontro visivo del legame nuvola -> voce. */
  .righello {
    display: grid;
    gap: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.38);
  }
  .banda {
    padding: 6px 0 0 0;
    border-right: 1px solid rgba(255, 255, 255, 0.22);
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    transition: color 0.25s ease;
    position: relative;
  }
  .banda:last-child { border-right: none; }
  .banda::before {
    content: "";
    position: absolute;
    left: 0; top: -1px;
    width: 0; height: 2px;
    background: #ffffff;
    transition: width 0.4s ease;
  }
  .banda.attiva { color: #ffffff; }
  .banda .strum { opacity: 0.55; margin-left: 5px; }
  .banda.attiva::before { width: 100%; }
  .righello.nascosto { display: none; }

  /* Quadrante dei dati */
  .quadrante {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid rgba(255, 255, 255, 0.38);
    border-bottom: 1px solid rgba(255, 255, 255, 0.38);
  }
  .dato {
    padding: 12px 16px 12px 0;
    border-right: 1px solid rgba(255, 255, 255, 0.22);
  }
  .dato:last-child { border-right: none; }
  .dato .cifra {
    font-size: 26px;
    letter-spacing: 0.02em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    text-transform: none;
  }
  .dato .cifra .piccolo { font-size: 12px; color: rgba(255, 255, 255, 0.65); }
  .dato .didascalia { color: rgba(255, 255, 255, 0.7); margin-top: 5px; }

  /* Sezioni di comandi */
  .sezione { display: flex; flex-direction: column; gap: 16px; }
  .rubrica {
    display: flex;
    align-items: center;
    gap: 12px;
    color: rgba(255, 255, 255, 0.85);
  }
  .rubrica .filo { flex: 1; height: 1px; background: rgba(255, 255, 255, 0.38); }
  .rubrica .codice { color: rgba(255, 255, 255, 0.6); letter-spacing: 0.1em; }

  .griglia {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(186px, 1fr));
    gap: 18px 34px;
  }
  .controllo { display: flex; flex-direction: column; gap: 9px; }
  /* Un comando che sta tutto su una riga: il nome a sinistra, l'interruttore a
     destra — come ogni altra riga del pannello, dove a destra c'è il valore. */
  .controllo.linea {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .controllo .nomeComando { color: rgba(255, 255, 255, 0.75); }
  .controllo > label {
    color: rgba(255, 255, 255, 0.75);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .controllo .valore {
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
  }

  /* Quadrante ad arco: tacche in cerchio, pallino pieno, targa sotto.
     Sotto il disegno resta un input[range] nativo, celato ma non rimosso:
     è lui a tenere il valore, e con lui restano tastiera e accessibilità. */
  .griglia.archi {
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 10px 24px;
  }
  .controllo.arco { align-items: center; gap: 2px; position: relative; }
  .disco { width: 100%; max-width: 152px; }
  .disco svg {
    display: block; width: 100%; height: auto; overflow: visible;
    touch-action: none;                 /* il trascinamento muove il pallino,
                                           non fa scorrere la pagina */
    -webkit-tap-highlight-color: transparent;
  }
  .disco .tacca { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.1; }
  .disco .pallino { fill: #ffffff; }
  .targa { text-align: center; }
  .targa .nome { color: rgba(255, 255, 255, 0.75); }
  .targa .lettura {
    font-size: 20px;
    letter-spacing: 0.02em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-transform: none;
    line-height: 1.2;
    margin-top: 3px;
  }
  .controllo.arco:focus-within .pallino {
    stroke: rgba(255, 255, 255, 0.55);
    stroke-width: 4;
  }

  /* La firma: un filetto, e sotto il nome e i recapiti. In grottesco e non in
     monospaziato, come in Rada: non fa parte dello strumento, e si vede. */
  .firma {
    margin-top: clamp(18px, 3vh, 34px);
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.38);
    text-align: center;
  }
  .firma p {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.7);
  }
  .firma .recapiti {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap; margin-top: 9px;
  }
  .firma a, .firma .posta {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .firma a { transition: color 0.2s ease, border-color 0.2s ease; }
  .firma a:hover { color: #ffffff; border-bottom-color: rgba(255, 255, 255, 0.6); }
  .firma a:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }
  .firma .sep { width: 1px; height: 10px; background: rgba(255, 255, 255, 0.38); flex: none; }
  @media (max-width: 479px) {
    .firma .sep { display: none; }
    .firma .recapiti { gap: 8px; flex-direction: column; }
  }

  /* Cursore: filetto con tacche e pallino pieno.
     La linea e le tacche sono SFONDI DELL'INPUT (due gradienti), non elementi
     disegnati sopra di esso — come in Rada. È la differenza fra un comando che
     risponde e uno che non risponde: con gli pseudo-elementi in `position:
     absolute` sul contenitore, `::after` viene dipinto dopo il contenuto e
     copre la metà inferiore del cursore, pallino compreso, intercettando il
     puntatore. Misurato: `elementFromPoint` non trovava più l'input da metà
     altezza in giù. Qui non c'è nulla sopra l'input, e tutta l'area risponde. */
  .cursore { position: relative; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 18px;
    margin: 0;
    background:
      linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45))
        0 8px / 100% 1px no-repeat,
      repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.35) 0 1px, transparent 1px 10%)
        0 9px / 100% 4px no-repeat;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 18px; background: transparent; border: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 9px; height: 9px;
    margin-top: 4.5px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 18px; background: transparent; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    cursor: pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
  }

  /* L'input che sta sotto un quadrante ad arco: resta nel DOM (tiene il valore
     e la tastiera) ma non si vede e non intercetta nulla. La specificità deve
     superare quella di `input[type="range"]`, altrimenti torna visibile. */
  input[type="range"].celato {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0;
    background: none;
    opacity: 0;
    pointer-events: none;
  }

  /* La fila dei quadretti del suono: a sinistra l'interruttore d'ascolto, a
     destra i quattro strumenti, tutti sulla stessa linea. I due poli agli
     estremi ripetono la struttura di ogni altra riga del pannello (nome a
     sinistra, valore a destra) e dicono da soli che il primo quadretto
     comanda un'altra cosa: non serve un filetto a separarli. */
  .fila {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px 26px;
  }
  .scelta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;      /* restano a destra anche andando a capo */
    gap: 12px 26px;
  }
  .tasto {
    font: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    background: transparent;
    border: none;
    padding: 0;
    height: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .tasto .quadro {
    width: 9px; height: 9px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: transparent;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .tasto:hover { color: rgba(255, 255, 255, 0.9); }
  .tasto.acceso { color: #ffffff; }
  .tasto.acceso .quadro { background: #ffffff; border-color: #ffffff; }

  /* Interruttore: quadretto pieno/vuoto + stato */
  .interruttore {
    font: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffffff;
    background: transparent;
    border: none;
    padding: 0;
    height: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .interruttore .quadro {
    width: 9px; height: 9px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    background: transparent;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .interruttore:hover .quadro { border-color: #ffffff; }
  .interruttore .stato { color: rgba(255, 255, 255, 0.6); }
  .interruttore.acceso .quadro { background: #ffffff; border-color: #ffffff; }
  .interruttore.acceso .stato { color: #ffffff; }
</style>
</head>
<body>

  <div class="stanza">

    <div class="testata">
      <div class="riga">
        <div class="marchio">Nuvole<span class="punto" aria-hidden="true"></span></div>
        <nav class="lingue tecnico" id="lingue" aria-label="Lingua"></nav>
      </div>
      <div class="filo"></div>
      <div class="riga tecnico">
        <span class="sigla" data-i18n="app.sigla">53 frasi in Do</span>
        <a class="guida" href="guida.html" target="_blank" rel="noopener"
           data-i18n="ui.guida" data-i18n-aria="ui.guidaAria">Guida</a>
      </div>
    </div>

    <div class="finestra">
      <canvas id="cielo"></canvas>
    </div>

    <div class="righello tecnico" id="righello"></div>

    <div class="quadrante tecnico">
      <div class="dato">
        <div class="cifra" id="datoFrase">—<span class="piccolo">/53</span></div>
        <div class="didascalia" data-i18n="q.frase">Frase dell'insieme</div>
      </div>
      <div class="dato">
        <div class="cifra" id="datoVoci">0<span class="piccolo">/6</span></div>
        <div class="didascalia" data-i18n="q.voci">Voci in ascolto</div>
      </div>
      <div class="dato">
        <div class="cifra" id="datoRegione">Do</div>
        <div class="didascalia" data-i18n="q.regione">Regione dell'arco</div>
      </div>
    </div>

    <div class="sezione">
      <div class="rubrica tecnico">
        <span data-i18n="sez.cielo">Cielo</span><span class="filo"></span><span class="codice">M1</span>
      </div>

      <div class="griglia archi tecnico">
        <div class="controllo arco">
          <div class="disco" id="discoSereno"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.sereno">Cielo sereno</div>
            <div class="lettura" id="valSereno"></div>
          </div>
          <input type="range" id="sereno" min="0" max="100" value="30" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoVento"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.vento">Vento</div>
            <div class="lettura" id="valVento"></div>
          </div>
          <input type="range" id="vento" min="0" max="100" value="36" class="celato">
        </div>
      </div>

      <div class="griglia tecnico">
        <div class="controllo">
          <label><span data-i18n="c.grana">Grana</span> <span class="valore" id="valGrana"></span></label>
          <div class="cursore"><input type="range" id="grana" min="5" max="20" value="9"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.ampiezza">Ampiezza nuvole</span> <span class="valore" id="valAmpiezza"></span></label>
          <div class="cursore"><input type="range" id="ampiezza" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.muta">Muta</span> <span class="valore" id="valMuta"></span></label>
          <div class="cursore"><input type="range" id="muta" min="0" max="100" value="40"></div>
        </div>
        <div class="controllo linea">
          <span class="nomeComando" id="etBande" data-i18n="c.bande">Bande</span>
          <button class="interruttore acceso" id="swBande" type="button"
                  aria-pressed="true" aria-labelledby="etBande">
            <span class="quadro"></span><span class="stato">Visibili</span>
          </button>
        </div>
      </div>
    </div>

    <div class="sezione">
      <div class="rubrica tecnico">
        <span data-i18n="sez.suono">Suono</span><span class="filo"></span><span class="codice">M2</span>
      </div>

      <div class="fila tecnico">
        <button class="interruttore" id="swAscolto" type="button"
                aria-pressed="false" data-i18n-aria="c.ascolto">
          <span class="quadro"></span><span class="stato">Silenzio</span>
        </button>
        <div class="scelta" id="scelta" role="group" data-i18n-aria="c.strumenti"></div>
      </div>

      <div class="griglia archi tecnico">
        <div class="controllo arco">
          <div class="disco" id="discoVolume"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.volume">Volume</div>
            <div class="lettura" id="valVolume"></div>
          </div>
          <input type="range" id="volume" min="0" max="100" value="55" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoRiverbero"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.riverbero">Riverbero</div>
            <div class="lettura" id="valRiverbero"></div>
          </div>
          <input type="range" id="riverbero" min="0" max="100" value="38" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoVoci"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.voci">Voci</div>
            <div class="lettura" id="valVoci"></div>
          </div>
          <input type="range" id="voci" min="1" max="10" value="6" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoSensibilita"></div>
          <div class="targa">
            <div class="nome" data-i18n="c.sensibilita">Sensibilità</div>
            <div class="lettura" id="valSensibilita"></div>
          </div>
          <input type="range" id="sensibilita" min="0" max="100" value="64" class="celato">
        </div>
      </div>

      <div class="griglia tecnico">
        <div class="controllo">
          <label><span data-i18n="c.dispersione">Dispersione</span> <span class="valore" id="valDispersione"></span></label>
          <div class="cursore"><input type="range" id="dispersione" min="1" max="4" value="3"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.avanzamento">Avanzamento</span> <span class="valore" id="valAvanzamento"></span></label>
          <div class="cursore"><input type="range" id="avanzamento" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.ripetizione">Ripetizione</span> <span class="valore" id="valRipetizione"></span></label>
          <div class="cursore"><input type="range" id="ripetizione" min="0" max="100" value="20"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.apertura">Apertura</span> <span class="valore" id="valApertura"></span></label>
          <div class="cursore"><input type="range" id="apertura" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.respiro">Respiro</span> <span class="valore" id="valRespiro"></span></label>
          <div class="cursore"><input type="range" id="respiro" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.colore">Colore</span> <span class="valore" id="valColore"></span></label>
          <div class="cursore"><input type="range" id="colore" min="0" max="100" value="100"></div>
        </div>
        <div class="controllo">
          <label><span data-i18n="c.larghezza">Larghezza</span> <span class="valore" id="valLarghezza"></span></label>
          <div class="cursore"><input type="range" id="larghezza" min="0" max="100" value="100"></div>
        </div>
        <div class="controllo">

/* localStorage può essere vietato (navigazione privata, file://): ogni
   accesso è protetto, l'app deve funzionare comunque. */
const CHIAVE_LINGUA = "nuvole.lang";
function lingueSalvata() {
  try { return localStorage.getItem(CHIAVE_LINGUA); } catch (e) { return null; }
}
function salvaLingua(v) {
  try { localStorage.setItem(CHIAVE_LINGUA, v); } catch (e) {}
}

function scegliLingua() {
  let q = null;
  try { q = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  if (LINGUE.includes(q)) return q;
  const salvata = lingueSalvata();
  if (LINGUE.includes(salvata)) return salvata;
  const pref = (navigator.languages && navigator.languages.length)
             ? navigator.languages : [navigator.language || ""];
  for (const tag of pref) {
    const primaria = String(tag).toLowerCase().split("-")[0];
    if (primaria === "it" || primaria === "fr" || primaria === "ja") return primaria;
  }
  return "en";
}

let lingua = scegliLingua();

function T(chiave) {
  const d = TESTI[lingua] || TESTI.en;
  return (chiave in d) ? d[chiave] : (TESTI.en[chiave] || chiave);
}
function Tn(chiave, n) { return T(chiave).replace("{n}", n); }

/* ------------------------------------------------------------------ */
/*  Parametri (alcuni pilotati dal pannello)                          */
/* ------------------------------------------------------------------ */
const PARAMS = {
  // Griglia
  passo:        9,      // distanza fra i puntini (px, coordinate CSS)
  passoRif:     22,     // passo di riferimento: le scale del rumore e la
                        // velocita' del vento sono tarate su questo, e vengono
                        // riportate al passo reale, cosi' infittire la matrice
                        // non rimpicciolisce le nuvole ne' le rallenta.
  raggioBase:   1.1,    // raggio del puntino di cielo sereno (invisibile)
  raggioNuvola: 2.6,    // raggio del puntino dentro la nuvola: cresce, perche'
                        // ora la nuvola e' la figura e non il vuoto

  // I due colori del puntino: cielo sereno -> nuvola.
  // ATTENZIONE: `celeste` deve restare identico al fondo della pagina (#5e9bc9),
  // altrimenti la matrice del cielo sereno riaffiora. Il canvas non ha fondo
  // proprio: i puntini stanno direttamente sul cielo della stanza, e si vedono
  // solo quelli che la nuvola ha sbiancato.
  celeste: { r: 94, g: 155, b: 201 },
  nuvola:  { r: 255, g: 255, b: 255 },

  // Campo-nuvole
  scalaForma:   0.075,  // dettaglio delle nuvole
  scalaMassa:   0.020,  // scala della copertura d'insieme
  soglia:       0.150,  // sotto questa densità: cielo sereno  (<- "cielo sereno")
  ampiezza:     0.065,  // ampiezza della transizione sereno -> nuvola

  // Deriva (vento)
  ventoX:       0.9,    // velocità orizzontale               (<- "vento")
  ventoY:       0.16,   // lieve deriva verticale
  morphMassa:   0.012,  // lentezza con cui la copertura muta

  glow:         false,  // su fondo chiaro un alone bianco non aggiunge nulla
};

/* Quanto vale un passo di griglia rispetto al passo di riferimento:
   converte scale del rumore e velocita' del vento da "unita' di riferimento"
   a colonne/righe della matrice reale. */
function fattoreGriglia() { return PARAMS.passo / PARAMS.passoRif; }

/* ------------------------------------------------------------------ */
/*  Rumore: value-noise 2D + fBm                                       */
/* ------------------------------------------------------------------ */
function hash2(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) | 0;
  n = (n * 1274126177) | 0;
  n = (n ^ (n >> 16)) >>> 0;
  return n / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const tl = hash2(xi,     yi);
  const tr = hash2(xi + 1, yi);
  const bl = hash2(xi,     yi + 1);
  const br = hash2(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  const top = tl + (tr - tl) * u;
  const bot = bl + (br - bl) * u;
  return top + (bot - top) * v;
}

function fbm(x, y) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < 4; i++) {
    sum  += amp * valueNoise(x * freq, y * freq);
    norm += amp;
    amp  *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ------------------------------------------------------------------ */
/*  Campo-nuvole                                                       */
/* ------------------------------------------------------------------ */
const CampoNuvole = {
  // dx, dy: fase di deriva accumulata (non tempo assoluto, così il vento
  // ne cambia il ritmo e non fa saltare le nuvole); tm: tempo per la muta.
  densita(col, row, dx, dy, tm) {
    const k = fattoreGriglia();
    const sForma = PARAMS.scalaForma * k;
    const sMassa = PARAMS.scalaMassa * k;
    const forma = fbm(
      (col - dx) * sForma,
      (row - dy) * sForma
    );
    const massa = fbm(
      (col - dx * 0.35) * sMassa + 100,
      (row) * sMassa + tm * PARAMS.morphMassa + 100
    );

    const densita = forma * (0.35 + massa * 0.95);
    return smoothstep(PARAMS.soglia, PARAMS.soglia + PARAMS.ampiezza, densita);
  }
};

/* ------------------------------------------------------------------ */
/*  Cielo: matrice + rendering nella finestra                         */
/* ------------------------------------------------------------------ */
const Cielo = {
  canvas: null, ctx: null, cornice: null,
  dpr: 1, w: 0, h: 0,
  cols: 0, rows: 0, offX: 0, offY: 0,
  lastTs: 0, phaseX: 0, phaseY: 0, tempo: 0,

  init() {
    this.canvas = document.getElementById("cielo");
    this.ctx = this.canvas.getContext("2d");
    this.cornice = document.querySelector(".finestra");
    this.cieloIniziale();
    this.resize();
    window.addEventListener("resize", () => this.resize());
    this.lastTs = performance.now();
    requestAnimationFrame((ts) => this.loop(ts));
  },

  /* Da dove comincia il cielo.

     Il campo di rumore è deterministico — `hash2` non ha seme — e la deriva
     partiva da zero: ogni visita si apriva perciò sullo stesso identico cielo,
     e due sessioni con gli stessi comandi vedevano passare le stesse nuvole
     agli stessi minuti. Misurato: impronta del campo invariata dopo il
     ricaricamento. Qui la deriva parte invece da un punto a caso del campo, e
     ogni visita trova un cielo diverso.

     Tre spostamenti indipendenti, perché tre sono le coordinate del campo: la
     forma in orizzontale (`phaseX`, che muove anche la massa), la forma in
     verticale (`phaseY`) e il tempo lento della copertura (`tempo`). Si
     ricavano da un solo numero con tre moltiplicatori irrazionali, così lo
     stesso numero dà sempre lo stesso cielo.

     Con `?cielo=<numero>` quel numero lo si sceglie: serve a condividere un
     cielo con qualcuno, e serve alle misure — buona parte delle tarature di
     questo progetto è stata fatta potendo tornare sullo stesso cielo. */
  cieloIniziale() {
    let seme = null;
    try { seme = new URLSearchParams(location.search).get("cielo"); } catch (e) {}
    // il seme si moltiplica per un primo grande, altrimenti numeri vicini
    // darebbero cieli quasi identici: uno scarto di 1 vale meno di un periodo
    // del rumore, e `?cielo=42` e `?cielo=43` si somiglierebbero.
    const n = (seme !== null && seme !== "" && isFinite(+seme))
            ? Math.abs(+seme) * 997
            : Math.random() * 1e6;
    this.phaseX = (n * 0.7919) % 4000;
    this.phaseY = (n * 0.3571) % 4000;
    this.tempo  = (n * 1.6180) % 20000;
  },

  // Dimensiona la finestra in modo responsive, lasciando spazio ai controlli
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);

    const maxW = this.cornice.clientWidth || window.innerWidth;
    const maxH = window.innerHeight * 0.60;
    let cw = maxW, ch = cw * 0.62;
    if (ch > maxH) { ch = maxH; }
    cw = Math.round(cw); ch = Math.round(ch);

    this.w = cw; this.h = ch;
    this.canvas.style.width  = cw + "px";
    this.canvas.style.height = ch + "px";
    this.canvas.width  = Math.floor(cw * this.dpr);
    this.canvas.height = Math.floor(ch * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    this.cols = Math.floor((cw - PARAMS.passo) / PARAMS.passo) + 1;
    this.rows = Math.floor((ch - PARAMS.passo) / PARAMS.passo) + 1;
    const larghGriglia = (this.cols - 1) * PARAMS.passo;
    const altGriglia   = (this.rows - 1) * PARAMS.passo;
    this.offX = (cw - larghGriglia) / 2;
    this.offY = (ch - altGriglia) / 2;
  },

  loop(ts) {
    let dt = (ts - this.lastTs) / 1000;
    this.lastTs = ts;
    if (!(dt >= 0) || dt > 0.25) dt = 0.016; // clamp (tab in background / primo frame)
    const k = 1 / fattoreGriglia();   // colonne al secondo alla densita' reale
    this.phaseX += PARAMS.ventoX * k * dt;
    this.phaseY += PARAMS.ventoY * k * dt;
    this.tempo  += dt;
    this.render();
    requestAnimationFrame((ts2) => this.loop(ts2));
  },

  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    const { celeste, nuvola, passo, raggioBase, raggioNuvola } = PARAMS;
    const dx = this.phaseX, dy = this.phaseY, tm = this.tempo;

    for (let r = 0; r < this.rows; r++) {
      const py = this.offY + r * passo;
      for (let c = 0; c < this.cols; c++) {
        const px = this.offX + c * passo;
        const q = CampoNuvole.densita(c, r, dx, dy, tm);

        const cr = Math.round(celeste.r + (nuvola.r - celeste.r) * q);
        const cg = Math.round(celeste.g + (nuvola.g - celeste.g) * q);
        const cb = Math.round(celeste.b + (nuvola.b - celeste.b) * q);
        const raggio = raggioBase + (raggioNuvola - raggioBase) * q;

        if (PARAMS.glow && q > 0.45) {
          ctx.shadowBlur = 4 * q;
          ctx.shadowColor = "rgba(255,255,255," + (0.55 * q).toFixed(3) + ")";
        } else {
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.fillStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        ctx.arc(px, py, raggio, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }
};

/* ------------------------------------------------------------------ */
/*  Archivio: 53 frasi in Do                                           */
/* ------------------------------------------------------------------ */
/* Ogni frase è una sequenza di eventi [semitoni da Do, durata in battiti];
   nota null = silenzio. Le frasi sono brevi, ripetibili, tutte in Do.

   NOTA. Questo archivio è ORIGINALE. Non riproduce le 53 cellule di "In C"
   di Terry Riley (1964), che sono opera sotto diritto d'autore: ne adotta
   il principio — cellule minime che ogni voce ripete a piacere, e un arco
   armonico che si sposta lentamente da una regione all'altra.

   LE CERNIERE. Più voci suonano insieme frasi diverse e vicine: la campata
   effettiva è la finestra di scelta (AUDIO.finestra) più una frase, perché
   una voce può star finendo la frase presa prima che il fronte avanzasse.
   Perciò due regioni confinanti non possono contenere lo stesso grado in due
   forme (Fa/Fa#, Mi/Mib, Si/Sib, La/Sib, Re/Mib): si scontrerebbero. Fra una
   regione e l'altra c'è quindi una CERNIERA di quattro frasi costruita sui
   soli suoni comuni, dove il grado vecchio si ritira prima che entri il nuovo.
   Verificato: nessuno scontro cromatico in alcuna finestra di 5 frasi
   consecutive, giro di boa 53->1 compreso. Se si cambia una frase, ricontrollare.

   L'arco, in dieci tratti:
      1-6    Do puro (Do-Mi-Sol)
      7-13   apertura pentatonica (Re, La)
     14-18   entra il Fa
     19-22   cerniera: il Fa si ritira
     23-29   il Fa#: la luce lidia
     30-34   regione di dominante (Si)
     35-38   cerniera: la quinta vuota, restano Do e Sol
     39-45   l'ombra (Mi bemolle, Si bemolle)
     46-49   cerniera: l'ombra si ritira (Do, Fa, Sol)
     50-53   rientro: tornano Mi e Si
   La 53 chiude su un Do lungo e il fronte torna alla 1: l'arco si richiude
   dove è cominciato. */

/* I dieci tratti dell'arco: qui solo la frase in cui ciascuno comincia. I nomi
   stanno nel dizionario (`reg.1`…`reg.10`) e dicono il cielo, non l'armonia:
   chi ascolta non ha bisogno di sapere che è entrato il Fa#, ha bisogno di
   sapere che la luce è cambiata.
     1  Sereno       1-6    Do puro: solo Do Mi Sol
     2  Cirri        7-13   la pentatonica si apre
     3  Velo        14-18   entra il Fa, il primo peso
     4  Radura      19-22   cerniera: il Fa si ritira
     5  Controluce  23-29   il Fa#: il tratto più luminoso
     6  Corrente    30-34   la dominante, il Si: tensione
     7  Vuoto d'aria 35-38  cerniera: restano Do e Sol
     8  Nembo       39-45   l'ombra di Mib e Sib
     9  Schiarita   46-49   cerniera: l'ombra si ritira
    10  Zenit       50-53   rientro: tornano Mi e Si                        */
const REGIONI = [0, 6, 13, 18, 22, 29, 34, 38, 45, 49];
function regione(i) {
  let n = 1;
  for (let k = 0; k < REGIONI.length; k++) if (i >= REGIONI[k]) n = k + 1;
  return T("reg." + n);
}

/*  Parametri del suono                                                */

const AUDIO = {

  voci:            6,    // quante voci (bande verticali della finestra)

  esce:         0.05,    // copertura sotto cui la voce si congeda
  finestra:        3,    // quante frasi attorno al fronte sono scegliibili
  lettureMin:      2,    // ripetizioni minime di una frase
  lettureMax:      5,    // ripetizioni massime
  lettureFronte:   6,    // letture d'insieme che fanno avanzare il fronte
  attesaFronte:   15,    // ...ma non più spesso di così (secondi)
  registro:        0,    // trasporto d'insieme, in semitoni
  strumenti: [true, true, true, true],   // quali strumenti sono in campo
  volume:       0.55,

  apertura:      1.0,    // ampiezza dei registri, in ottave per lato (0 = un coro
                         // stretto, 2 = quattro ottave, i gravi a sinistra)
  larghezza:     1.0,    // panorama: 0 = mono, 1 = la banda occupa tutto il campo
  colore:      18000,    // taglio del passa-basso d'insieme, in Hz
  riverbero:    0.38,
};

/* ------------------------------------------------------------------ */
/*  I quattro strumenti                                                */
/* ------------------------------------------------------------------ */
/* Ognuno costruisce da zero i propri nodi e li attacca a `v.uscita` (da lì il
   panorama della banda e la mandata al riverbero sono già a posto). Ricevono
   la voce, la frequenza, la durata in secondi, l'ampiezza e l'istante d'attacco.
   Nessun campione: la differenza fra i quattro sta tutta nella forma d'onda e,
   soprattutto, nella forma dell'inviluppo — è l'attacco a dire che strumento è.
   I fattori di ampiezza sono tarati a orecchie chiuse, misurando in
   OfflineAudioContext l'energia di una stessa nota resa dai quattro. */
const STRUMENTI = [
  {
    chiave: "onda",
    /* Il timbro d'origine: onda semplice con l'ottava sopra appena percettibile,
       attacco morbido, coda lunga. È il fondo su cui stanno gli altri tre. */
    suona(v, freq, dur, amp, t) {
      const ctx = Suono.ctx;
      const R = AUDIO.respiro;
      const tenuta = Math.max(0.12, dur * 0.82), coda = AUDIO.rilascio * R;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp, t + AUDIO.attacco * R);
      g.gain.setValueAtTime(amp, t + tenuta);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tenuta + coda);

      const f = ctx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 900 + 4000 * v.densita;
      f.Q.value = 0.4;

      const o = ctx.createOscillator();
      o.type = v.onda; o.frequency.value = freq;
      const arm = ctx.createOscillator();
      arm.type = "sine"; arm.frequency.value = freq * 2;
      const garm = ctx.createGain(); garm.gain.value = 0.14;

      o.connect(f); arm.connect(garm); garm.connect(f);
      f.connect(g); g.connect(v.uscita);
      const fine = t + tenuta + coda + 0.05;
      o.start(t); o.stop(fine); arm.start(t); arm.stop(fine);
      o.onended = () => { g.disconnect(); f.disconnect(); garm.disconnect(); };
    }
  },
  {
    chiave: "vetro",
    /* Glockenspiel, sulla ricetta della "goccia" di Rada: sintesi FM con
       portante sinusoidale e modulante a rapporto armonico basso (3), più un
       filo di parziale scordato dell'1% che dà un battimento lento. Due cose
       fanno il metallo: l'attacco di 12 ms, e soprattutto l'indice di
       modulazione che **decade in fretta** — il colpo entra brillante e si
       schiarisce in 0,22 s in una sinusoide che continua a suonare.
       L'indice al colpo (1.2, cioè deviazione 3.6·f su modulante 3·f) è scelto
       misurando l'energia sopra i 2 kHz nell'attacco: 0.3 dava l'1,5% — troppo
       poco, un suono sordo; 1.8 arrivava al 21% e con sei voci diventava
       tagliente; 1.2 dà l'11%. Il picco non cambia con l'indice: la modulazione
       ridistribuisce l'energia, non ne aggiunge. Suona
       un'ottava sopra lo scritto, come lo strumento vero: la classe d'altezza
       non cambia, quindi la garanzia dell'archivio resta intatta. */
    suona(v, freq, dur, amp, t) {
      const ctx = Suono.ctx;
      const R = AUDIO.respiro;
      const f = freq * 2;
      const coda = Math.min(3.0, Math.max(1.3, dur * 1.6)) * R;
      const fine = t + coda + 0.1;

      const port = ctx.createOscillator();
      port.type = "sine"; port.frequency.value = f;

      const mod = ctx.createOscillator();
      mod.type = "sine"; mod.frequency.value = f * 3;
      const gmod = ctx.createGain();
      gmod.gain.setValueAtTime(f * 3.6, t);          // indice 1.2 al colpo
      gmod.gain.exponentialRampToValueAtTime(f * 0.04, t + 0.22);
      mod.connect(gmod); gmod.connect(port.frequency);

      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(amp * 0.94, t + 0.012 * R);
      env.gain.exponentialRampToValueAtTime(0.0001, t + coda);

      const par = ctx.createOscillator();
      par.type = "sine"; par.frequency.value = f * 2.01;
      const gpar = ctx.createGain();
      gpar.gain.setValueAtTime(0.0001, t);
      gpar.gain.linearRampToValueAtTime(amp * 0.15, t + 0.010 * R);
      gpar.gain.exponentialRampToValueAtTime(0.0001, t + coda * 0.55);

      port.connect(env); env.connect(v.uscita);
      par.connect(gpar); gpar.connect(v.uscita);
      port.start(t); port.stop(fine);
      mod.start(t); mod.stop(fine);
      par.start(t); par.stop(fine);
      port.onended = () => { env.disconnect(); gmod.disconnect(); gpar.disconnect(); };
    }
  },
  {
    chiave: "legno",
    /* Battente su barra di marimba: la fondamentale sinusoidale che si spegne
       presto, il primo parziale a 4× (due ottave sopra: è così che si accordano
       le barre) che se ne va ancora prima, e un colpo di rumore scuro di 30 ms
       — il contatto del battente sul legno. È l'opposto del Vetro: stessa
       famiglia percussiva, ma caldo, corto e senza metallo. */
    suona(v, freq, dur, amp, t) {
      const ctx = Suono.ctx;
      const R = AUDIO.respiro;
      const coda = Math.min(1.5, Math.max(0.5, dur * 0.8)) * R;
      const fine = t + coda + 0.1;

      const o = ctx.createOscillator();
      o.type = "sine"; o.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(amp * 0.90, t + 0.004 * R);
      g.gain.exponentialRampToValueAtTime(0.0001, t + coda);

      const barra = ctx.createOscillator();
      barra.type = "sine"; barra.frequency.value = freq * 4;
      const gbarra = ctx.createGain();
      gbarra.gain.setValueAtTime(0.0001, t);
      gbarra.gain.linearRampToValueAtTime(amp * 0.23, t + 0.003 * R);
      gbarra.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.20, coda * 0.3));

      const n = ctx.createBufferSource();
      n.buffer = Suono.rumore(); n.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = Math.min(2400, freq * 5); lp.Q.value = 0.7;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(amp * 0.43, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);

      o.connect(g); g.connect(v.uscita);
      barra.connect(gbarra); gbarra.connect(v.uscita);
      n.connect(lp); lp.connect(gn); gn.connect(v.uscita);

      o.start(t); o.stop(fine);
      barra.start(t); barra.stop(t + 0.35);
      n.start(t); n.stop(t + 0.06);
      o.onended = () => { g.disconnect(); gbarra.disconnect(); lp.disconnect(); gn.disconnect(); };
    }
  },
  {
    chiave: "soffio",
    /* Soffio: rumore bianco filtrato stretto attorno alla nota, e sotto una
       sinusoide che le dà l'intonazione. Attacco lento, tenuta piena, un vibrato
       appena accennato: è l'unico dei quattro che si sente respirare. */
    suona(v, freq, dur, amp, t) {
      const ctx = Suono.ctx;
      const R = AUDIO.respiro;
      const tenuta = Math.max(0.3, dur * 0.9), coda = 0.5 * R;
      const fine = t + tenuta + coda + 0.05;

      const g = ctx.createGain();
      const picco = amp * 1.90;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(picco, t + Math.min(0.35 * R, tenuta * 0.5));
      g.gain.setValueAtTime(picco, t + tenuta);
      g.gain.exponentialRampToValueAtTime(0.0001, t + tenuta + coda);

      const n = ctx.createBufferSource();
      n.buffer = Suono.rumore(); n.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = 13;
      const gn = ctx.createGain(); gn.gain.value = 0.5;

      const o = ctx.createOscillator();
      o.type = "sine"; o.frequency.value = freq;
      const go = ctx.createGain(); go.gain.value = 0.5;

      const lfo = ctx.createOscillator();
      lfo.type = "sine"; lfo.frequency.value = 4.6;
      const glfo = ctx.createGain(); glfo.gain.value = freq * 0.006;
      lfo.connect(glfo); glfo.connect(o.frequency); glfo.connect(bp.frequency);

      n.connect(bp); bp.connect(gn); gn.connect(g);
      o.connect(go); go.connect(g);
      g.connect(v.uscita);
      n.start(t); n.stop(fine); o.start(t); o.stop(fine);
      lfo.start(t); lfo.stop(fine);
      o.onended = () => {
        g.disconnect(); bp.disconnect(); gn.disconnect();
        go.disconnect(); glfo.disconnect();
      };
    }
  },
];

/* I quattro disposti lungo un asse: dal velo sottile alla nuvola piena.
   Il velo chiama un suono breve e brillante, la nuvola piena un suono tenuto
   e pieno di fiato. È l'ordine su cui `strumentoDellaNuvola` fa la sua scelta. */
const ORDINE_SPESSORE = [1, 2, 0, 3];   // Vetro · Legno · Onda · Soffio

/* ------------------------------------------------------------------ */
/*  Suono: le nuvole scelgono le frasi                                 */
/* ------------------------------------------------------------------ */
/* Ogni voce presidia una banda verticale della finestra. Quando una nuvola
   entra nella sua banda la voce si sveglia, sceglie a caso una frase nella
   finestra corrente dell'archivio e la ripete; quando la nuvola esce, la
   voce finisce la lettura e tace. Poiché le nuvole attraversano le bande in
   momenti diversi, le voci entrano e escono senza accordarsi: le
   sovrapposizioni non sono scritte da nessuna parte.

   Dell'"In C" restano tre regole: il polso condiviso (le frasi partono tutte
   su un battito, ma hanno lunghezze diverse e quindi sfasano), l'archivio
   percorso in avanti e mai a salti (il "fronte" avanza di una frase alla
   volta), e la libertà di ciascuna voce dentro un intorno ristretto del
   fronte — così l'insieme resta in una stessa regione armonica senza mai
   ripetere la stessa combinazione. */
const Suono = {
  ctx: null, master: null, convolutore: null, invio: null,
  voci: [], timer: null, attivo: false,
  fronte: 0, letture: 0, ultimoPasso: 0, tDensita: 0,

  battito() { return 60 / AUDIO.bpm; },

  /* --- catena audio ------------------------------------------------ */
  creaContesto() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0;               // si apre in dissolvenza

    /* Il colore d'insieme: un passa-basso in fondo alla catena, dopo il
       riverbero, così vela tutto — voci e coda dell'ambiente insieme. */
    this.filtro = this.ctx.createBiquadFilter();
    this.filtro.type = "lowpass";
    this.filtro.frequency.value = AUDIO.colore;
    this.filtro.Q.value = 0.4;
    this.master.connect(this.filtro);
    this.filtro.connect(this.ctx.destination);

    // Riverbero: risposta all'impulso generata, nessun file esterno.
    this.convolutore = this.ctx.createConvolver();
    this.convolutore.buffer = this.rispostaImpulso(3.4, 2.4);
    this.invio = this.ctx.createGain();
    this.invio.gain.value = AUDIO.riverbero;
    this.invio.connect(this.convolutore);
    this.convolutore.connect(this.master);
  },

  /* Due secondi di rumore bianco, generati una volta sola: la sorgente del
     Soffio. Ogni nota ne prende un pezzo in loop. */
  rumore() {
    if (!this._rumore) {
      const n = Math.floor(this.ctx.sampleRate * 2);
      const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this._rumore = b;
    }
    return this._rumore;
  },

  rispostaImpulso(secondi, decadimento) {
    const sr = this.ctx.sampleRate;
    const n = Math.floor(sr * secondi);
    const buf = this.ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const dati = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) {
        dati[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decadimento);
      }
    }
    return buf;
  },

  /* --- le voci ----------------------------------------------------- */
  /* L'ottava di una voce viene dalla sua posizione nella finestra: a sinistra i
     gravi, a destra gli acuti, e l'*Apertura* dice quante ottave separano i due
     estremi. Il trasporto è sempre di ottave intere, mai di altri intervalli:
     l'ottava conserva la classe d'altezza, e con essa la garanzia dell'archivio
     contro gli scontri cromatici. Un trasporto di quinta la distruggerebbe. */
  ottavaDi(pos) {
    // arrotondamento simmetrico: Math.round(-0.5) dà 0 e Math.round(0.5) dà 1,
    // e le sei voci uscirebbero sbilanciate verso l'acuto.
    const x = pos * AUDIO.apertura;
    return Math.sign(x) * Math.round(Math.abs(x)) * 12;
  },

  /* Apertura e larghezza si applicano a voci già in corso senza ricostruirle:
     le note già programmate tengono la frequenza che avevano, le prossime
     nascono con la nuova. Nessuno scatto. */
  riallineaVoci() {
    for (const v of this.voci) {
      v.ottava = this.ottavaDi(v.pos);
      if (v.pan) v.pan.pan.value = v.pos * AUDIO.larghezza;
    }
  },

  creaVoci() {
    const onde = ["sine", "triangle"];
    this.voci = [];
    for (let i = 0; i < AUDIO.voci; i++) {
      const a = i / AUDIO.voci, b = (i + 1) / AUDIO.voci;
      const pos = ((a + b) / 2) * 2 - 1;                // -1 a sinistra, +1 a destra
      const pan = this.ctx.createStereoPanner
        ? this.ctx.createStereoPanner() : null;
      if (pan) pan.pan.value = pos * AUDIO.larghezza;
      const uscita = this.ctx.createGain();
      uscita.gain.value = 1;
      uscita.connect(pan || this.master);
      if (pan) { pan.connect(this.master); pan.connect(this.invio); }
      else uscita.connect(this.invio);

      this.voci.push({
        banda: [a, b],
        pos: pos,
        ottava: this.ottavaDi(pos),
        onda: onde[i % onde.length],
        strumento: 0,
        uscita: uscita, pan: pan,
        densita: 0, copertura: 0,
        frase: null, indice: 0, letture: 0, max: 0, attesa: 99, spessoreScelta: -1,
        tProssimo: 0,
      });
    }
  },

  /* Cambiare il numero di voci ridisegna le bande. I nodi vecchi restano
     collegati ancora due secondi, il tempo che le note in corso si spengano:
     staccarli subito darebbe uno scatto. */
  impostaVoci(n) {
    AUDIO.voci = n;
    if (!this.ctx) return;
    const vecchie = this.voci;
    this.creaVoci();
    const t = this.ctx.currentTime + 0.3;
    this.voci.forEach(v => { v.tProssimo = t; });
    setTimeout(() => vecchie.forEach(v => {
      try { v.uscita.disconnect(); if (v.pan) v.pan.disconnect(); } catch (e) {}
    }), 2000);
  },

  /* --- lettura del cielo sulla banda di ciascuna voce ---------------- */
  /* Il campo che disegna la finestra è letto qui come partitura, a grana
     grossa e non più di dieci volte al secondo. Se ne ricavano due misure:
       copertura — quanta parte della banda sta dentro una nuvola: è il
                   segnale di attacco e di congedo (la nuvola che arriva);
       densita   — la media, che governa dinamica e apertura del filtro.
     La copertura è preferita alla media perché la media di una banda alta e
     stretta resta sempre bassa, e al massimo perché il massimo satura a 1
     appena un solo punto è dentro una nuvola. Distribuzioni misurate sul
     campo reale (18 s, cielo al 45%): copertura p50 0-0.19, picchi 0.47. */
  aggiornaDensita(ora) {
    if (ora - this.tDensita < 0.1) return;
    this.tDensita = ora;
    const dx = Cielo.phaseX, dy = Cielo.phaseY, tm = Cielo.tempo;
    for (const v of this.voci) {
      const c0 = Math.floor(v.banda[0] * Cielo.cols);
      const c1 = Math.max(c0 + 1, Math.floor(v.banda[1] * Cielo.cols));
      let somma = 0, dentro = 0, n = 0;
      for (let c = c0; c < c1; c += 3) {
        for (let r = 0; r < Cielo.rows; r += 5) {
          const q = CampoNuvole.densita(c, r, dx, dy, tm);
          somma += q;
          if (q > 0.5) dentro++;
          n++;
        }
      }
      v.densita   = n ? somma / n : 0;
      v.copertura = n ? dentro / n : 0;
    }
  },

  /* --- l'archivio: fronte e scelta ---------------------------------- */

  /* Di quanto una voce è rimasta indietro rispetto al fronte (distanza
     circolare con segno: positiva = indietro, negativa = avanti). */
  ritardo(iFrase, fronte) {
    let d = (fronte - iFrase + FRASI.length) % FRASI.length;
    if (d > FRASI.length / 2) d -= FRASI.length;
    return d;
  },

  /* L'insieme non lascia indietro nessuno: il fronte avanza solo quando ogni
     voce che sta suonando è al massimo una frase dietro la nuova posizione.
     È la disciplina che in "In C" è affidata ai musicisti, ed è anche ciò che
     rende valida la garanzia dell'archivio: senza, una voce può trascinare una
     frase di sei posizioni più indietro e far scontrare Fa e Fa#. */
  avanzaFronte(ora) {
    if (ora - this.ultimoPasso < AUDIO.attesaFronte) return;
    const nuovo = (this.fronte + 1) % FRASI.length;
    for (const v of this.voci) {
      if (v.frase && this.ritardo(v.iFrase, nuovo) > 1) return;   // aspetta
    }
    this.ultimoPasso = ora;
    this.fronte = nuovo;
  },

  /* Lo spessore della nuvola sulla banda, riportato a 0..1. Una voce si sveglia
     solo quando la nuvola è già arrivata, quindi al risveglio la densità media
     è ben distribuita: misurata su 79 risvegli ai valori di partenza,
     p05 0.145 · p25 0.234 · p50 0.418 · p75 0.643 · p90 0.852 · max 0.98.
     Gli estremi 0.05 e 0.85 sono ricavati da quei quartili, perché con quattro
     strumenti accesi i quattro tratti risultino ugualmente frequentati; una
     prima taratura a 0.10-0.95, fatta su un solo campione più nuvoloso, lasciava
     Onda e Soffio quasi sempre fuori. Se si cambia il cielo, ri-misurare. */
  spessore(v) {
    return Math.min(1, Math.max(0, (v.densita - 0.05) / 0.80));
  },

  /* È la nuvola a scegliere lo strumento. Gli strumenti accesi si dispongono
     lungo l'asse dello spessore e la nuvola cade in uno dei tratti: un velo
     sottile chiama il Vetro, una nuvola piena chiama il Soffio. Se ne è acceso
     uno solo, tutto l'insieme suona con quello.
     La scelta si rinnova a ogni episodio *vero*: se la voce si congeda e
     riparte subito — cosa che accade di continuo mentre una nuvola staziona
     sulla banda — tiene il timbro che aveva, altrimenti si sentirebbe cambiare
     strumento a metà del discorso. */
  strumentoDellaNuvola(v) {
    const attivi = ORDINE_SPESSORE.filter((i) => AUDIO.strumenti[i]);
    if (!attivi.length) return 0;
    // Il piccolo scarto casuale serve a non fare del confine una lama: due
    // nuvole quasi identiche non devono dare sempre e per forza lo stesso.
    const t = Math.min(1, Math.max(0,
      this.spessore(v) + (Math.random() - 0.5) * 0.12));
    return attivi[Math.min(attivi.length - 1, Math.floor(t * attivi.length))];
  },

  sveglia(v) {
    const scarto = Math.floor(Math.random() * AUDIO.finestra);
    v.iFrase = (this.fronte + scarto) % FRASI.length;
    v.frase = FRASI[v.iFrase];
    v.indice = 0;
    v.letture = 0;
    /* Si rifà la scelta quando la voce è stata zitta almeno quattro battiti,
       quando lo strumento in uso è stato spento dal pannello, oppure quando la
       nuvola si è fatta sensibilmente più spessa o più sottile (più di un
       tratto dell'asse). Senza quest'ultima condizione, una nuvola che staziona
       sulla banda non lascia mai alla voce il silenzio per ripensarci, e il
       timbro resta quello del primo arrivo anche se il cielo si è chiuso:
       misurato, con cielo coperto e densità mediana 0.78 uscivano ancora Vetro
       e Legno, cioè i timbri del velo sottile. */
    const t = this.spessore(v);
    if (v.attesa >= 4 || !AUDIO.strumenti[v.strumento] ||
        Math.abs(t - v.spessoreScelta) > 0.28) {
      v.strumento = this.strumentoDellaNuvola(v);
      v.spessoreScelta = t;
    }
    v.attesa = 0;
    v.max = AUDIO.lettureMin +
            Math.floor(Math.random() * (AUDIO.lettureMax - AUDIO.lettureMin + 1));
  },

  congeda(v) {
    v.frase = null;
    v.indice = 0;
    v.letture = 0;
  },

  /* --- scheduler ---------------------------------------------------- */
  tick() {
    const ora = this.ctx.currentTime;
    const orizzonte = ora + 0.25;
    this.aggiornaDensita(ora);
    for (const v of this.voci) this.avanza(v, orizzonte, ora);
  },

  avanza(v, orizzonte, ora) {
    let passi = 0;
    while (v.tProssimo < orizzonte && passi++ < 64) {
      if (v.frase === null) {
        // In attesa: la voce resta sulla griglia del polso, in silenzio,
        // finché la nuvola non arriva sulla sua banda.
        if (v.copertura >= AUDIO.entra) this.sveglia(v);
        else { v.tProssimo += this.battito(); v.attesa++; continue; }
      }

      const ev = v.frase[v.indice];
      if (ev[0] !== null) this.nota(v, ev[0], ev[1], v.tProssimo);
      v.tProssimo += ev[1] * this.battito();
      v.indice++;

      if (v.indice >= v.frase.length) {
        v.indice = 0;
        v.letture++;
        this.letture++;
        if (this.letture % AUDIO.lettureFronte === 0) this.avanzaFronte(ora);
        // Si congeda se la nuvola è passata, se ha finito le sue ripetizioni,
        // o se il fronte l'ha lasciata indietro (in tal caso, se la nuvola è
        // ancora sulla banda, al battito seguente sceglie una frase aggiornata).
        if (v.copertura < AUDIO.esce || v.letture >= v.max ||
            this.ritardo(v.iFrase, this.fronte) > 0) this.congeda(v);
      }
    }
  },

  /* --- una nota: calcola altezza, durata e ampiezza, poi passa la mano
         allo strumento della voce ---------------------------------------- */
  nota(v, semitoni, durata, t) {
    const freq = 261.626 * Math.pow(2, (semitoni + v.ottava + AUDIO.registro) / 12);
    const dur = durata * this.battito();
    const amp = 0.13 * Math.min(1, 0.45 + v.densita * 1.8);
    (STRUMENTI[v.strumento] || STRUMENTI[0]).suona(v, freq, dur, amp, t);
  },

  /* --- accensione e spegnimento -------------------------------------- */
  avvia() {
    if (!this.ctx) { this.creaContesto(); this.creaVoci(); }
    this.ctx.resume();
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(AUDIO.volume, t + 1.5);
    this.voci.forEach(v => { v.tProssimo = t + 0.3; this.congeda(v); });
    this.ultimoPasso = t;
    this.attivo = true;
    this.timer = setInterval(() => this.tick(), 25);
  },

  ferma() {
    if (!this.ctx) return;
    this.attivo = false;
    clearInterval(this.timer);
    this.timer = null;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => { if (!this.attivo) this.ctx.suspend(); }, 1500);
  },

  colore(hz) {
    AUDIO.colore = hz;
    if (this.filtro) this.filtro.frequency.value = hz;
  },

  riverbero(v) {
    AUDIO.riverbero = v;
    if (this.invio) this.invio.gain.value = v;
  },

  volume(v) {
    AUDIO.volume = v;
    if (this.ctx && this.attivo) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value, t);
      this.master.gain.linearRampToValueAtTime(v, t + 0.15);
    }
  },
};

/* ------------------------------------------------------------------ */
/*  Pannello di controllo                                              */
/* ------------------------------------------------------------------ */
/* Ogni comando scrive in PARAMS (il cielo) o in AUDIO (il suono), e nient'altro:
   il pannello non conosce né il rendering né lo scheduler. */
const Pannello = {

  /* Un cursore: mappa 0..100 (o il proprio intervallo) sul parametro, e
     scrive l'etichetta del valore. */
  rinfresca: [],       // funzioni da rieseguire quando cambia la lingua

  cursore(id, applica) {
    const el = document.getElementById(id);
    const val = document.getElementById("val" + id[0].toUpperCase() + id.slice(1));
    const agisci = () => { if (val) val.textContent = applica(+el.value); };
    el.addEventListener("input", agisci);
    this.rinfresca.push(agisci);
    agisci();
  },

  /* Un quadrante ad arco. Disegna le tacche e il pallino, e traduce il
     puntatore in valore dell'input nativo che gli sta sotto (`celato`), il
     quale resta la sorgente di verità: `cursore()` non sa che esiste l'arco.
     Geometria: centro (70,70), arco da 195° a -15°, tacche fra r=58 e r=66,
     pallino su r=46 — come nelle reference, il pallino corre dentro le tacche. */
  arco(id) {
    const NS = "http://www.w3.org/2000/svg";
    const CX = 70, CY = 70, A0 = 195, A1 = -15;
    const R_INT = 58, R_EST = 66, R_PAL = 46;

    const input = document.getElementById(id);
    const disco = document.getElementById("disco" + id[0].toUpperCase() + id.slice(1));
    const min = +input.min, max = +input.max;
    // Se la corsa è breve, una tacca per ogni scatto; altrimenti ventiquattro.
    const passi = (max - min) <= 12 ? (max - min) : 24;

    const punto = (t, r) => {
      const a = (A0 + (A1 - A0) * t) * Math.PI / 180;
      return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
    };

    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 140 92");
    svg.setAttribute("aria-hidden", "true");
    for (let i = 0; i <= passi; i++) {
      const t = i / passi;
      const [x1, y1] = punto(t, R_INT), [x2, y2] = punto(t, R_EST);
      const l = document.createElementNS(NS, "line");
      l.setAttribute("class", "tacca");
      l.setAttribute("x1", x1.toFixed(2)); l.setAttribute("y1", y1.toFixed(2));
      l.setAttribute("x2", x2.toFixed(2)); l.setAttribute("y2", y2.toFixed(2));
      svg.appendChild(l);
    }
    const pallino = document.createElementNS(NS, "circle");
    pallino.setAttribute("class", "pallino");
    pallino.setAttribute("r", "4.6");
    svg.appendChild(pallino);
    disco.appendChild(svg);

    const disegna = () => {
      const t = (+input.value - min) / (max - min);
      const [x, y] = punto(t, R_PAL);
      pallino.setAttribute("cx", x.toFixed(2));
      pallino.setAttribute("cy", y.toFixed(2));
    };

    // Dal puntatore all'angolo, e dall'angolo al valore. Sotto l'arco c'è un
    // settore morto di 150°: lì il puntatore va al capo più vicino.
    const daPuntatore = (ev) => {
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * 140;
      const y = (ev.clientY - r.top) / r.height * 92;
      let a = Math.atan2(CY - y, x - CX) * 180 / Math.PI;
      if (a < A0 - 360) a += 360;
      if (a < A1) a = (a > -90) ? A1 : A0;
      const t = Math.min(1, Math.max(0, (A0 - a) / (A0 - A1)));
      const v = Math.round(min + t * (max - min));
      if (v !== +input.value) {
        input.value = v;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    };

    svg.style.cursor = "pointer";
    svg.addEventListener("pointerdown", (ev) => {
      daPuntatore(ev);                 // prima il valore: se la cattura fallisce
      ev.preventDefault();             // (puntatore sintetico, browser vecchio),
      try {                            // il clic deve comunque valere
        svg.setPointerCapture(ev.pointerId);
        input.focus({ preventScroll: true });
      } catch (e) { /* si trascina lo stesso, senza cattura */ }
    });
    svg.addEventListener("pointermove", (ev) => {
      if (svg.hasPointerCapture(ev.pointerId)) daPuntatore(ev);
    });
    const rilascia = (ev) => {
      try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
    };
    svg.addEventListener("pointerup", rilascia);
    svg.addEventListener("pointercancel", rilascia);

    input.addEventListener("input", disegna);
    disegna();
  },

  /* Un interruttore: quadretto pieno/vuoto, due stati, due etichette. */
  /* `chiavi` sono due chiavi del dizionario, non due parole: l'interruttore
     si riscrive da sé quando la lingua cambia. */
  interruttore(id, acceso, chiavi, applica) {
    const el = document.getElementById(id);
    const stato = el.querySelector(".stato");
    let on = acceso;
    const mostra = () => {
      el.classList.toggle("acceso", on);
      el.setAttribute("aria-pressed", on ? "true" : "false");
      stato.textContent = T(on ? chiavi[1] : chiavi[0]);
      applica(on);
    };
    el.addEventListener("click", () => { on = !on; mostra(); });
    this.rinfresca.push(mostra);
    mostra();
    return { leggi: () => on, scrivi: (v) => { on = v; mostra(); } };
  },

  init() {
    /* ---- Cielo ---- */
    this.cursore("sereno", (v) => {
      PARAMS.soglia = 0.10 + (v / 100) * (0.21 - 0.10);
      return Tn("v.pct", v);
    });
    this.cursore("vento", (v) => {
      PARAMS.ventoX = (v / 100) * 2.5;
      PARAMS.ventoY = PARAMS.ventoX * 0.18;
      return Tn("v.pct", v);
    });
    this.cursore("grana", (v) => {
      PARAMS.passo = v;                 // fattoreGriglia() tiene ferme le nuvole
      Cielo.resize();
      return Tn("v.px", v);
    });
    this.cursore("ampiezza", (v) => {
      // Più alto = nuvole più larghe: la scala del rumore diminuisce. La corsa
      // si ferma a 0.035 perché più in là la nuvola supera la finestra: il campo
      // resta uniforme, il cielo non si copre mai e l'insieme ammutolisce.
      PARAMS.scalaForma = 0.115 - (v / 100) * 0.080;
      PARAMS.scalaMassa = PARAMS.scalaForma * 0.267;   // la massa segue la forma
      return Tn("v.pct", v);
    });
    this.cursore("muta", (v) => {
      PARAMS.morphMassa = (v / 100) * 0.030;
      return Tn("v.pct", v);
    });

    /* ---- Suono ---- */
    this.interruttore("swAscolto", false, ["c.ascolto.off", "c.ascolto.on"], (on) => {
      if (on === Suono.attivo) return;
      if (on) Suono.avvia(); else Suono.ferma();
    });
    this.interruttore("swBande", true, ["c.bande.off", "c.bande.on"], (on) => {
      document.getElementById("righello").classList.toggle("nascosto", !on);
    });

    this.strumenti();

    this.cursore("volume", (v) => { Suono.volume(v / 100); return Tn("v.pct", v); });
    this.cursore("voci", (v) => {
      if (v !== AUDIO.voci) { Suono.impostaVoci(v); this.righello(); }
      return v;
    });
    this.cursore("sensibilita", (v) => {
      // Più alta = basta poca nuvola per svegliare una voce.
      AUDIO.entra = 0.28 - (v / 100) * 0.25;
      AUDIO.esce  = AUDIO.entra * 0.4;
      return Tn("v.pct", v);
    });
    this.cursore("dispersione", (v) => {
      // La corsa si ferma a 4 perché l'archivio garantisce l'assenza di scontri
      // cromatici solo entro una campata di 5 frasi (4 di scelta + 1 di coda).
      AUDIO.finestra = v;
      return Tn(v === 1 ? "v.frase" : "v.frasi", v);
    });
    this.cursore("avanzamento", (v) => {
      // Ogni quanto l'insieme può passare alla frase successiva.
      AUDIO.attesaFronte = 60 * Math.pow(0.06, v / 100);
      return Tn("v.s", Math.round(AUDIO.attesaFronte));
    });
    this.cursore("riverbero", (v) => { Suono.riverbero(v / 100); return Tn("v.pct", v); });
    this.cursore("ripetizione", (v) => {
      // quante volte una voce ripete la frase prima di lasciarla
      AUDIO.lettureMin = 1 + Math.round(v / 100 * 6);
      AUDIO.lettureMax = AUDIO.lettureMin + 1 + Math.round(v / 100 * 8);
      return AUDIO.lettureMin + "–" + AUDIO.lettureMax;
    });
    this.cursore("apertura", (v) => {
      AUDIO.apertura = v / 50;               // ottave per lato: 0 … 2
      Suono.riallineaVoci();
      return Tn("v.pct", v);
    });
    this.cursore("larghezza", (v) => {
      AUDIO.larghezza = v / 100;
      Suono.riallineaVoci();
      return Tn("v.pct", v);
    });
    this.cursore("colore", (v) => {
      // corsa esponenziale: 600 Hz velato … 18 kHz, cioè trasparente
      Suono.colore(600 * Math.pow(30, v / 100));
      return Tn("v.pct", v);
    });
    this.cursore("respiro", (v) => {
      // corsa esponenziale centrata sull'unità: a metà corsa il suono è quello
      // di riferimento, agli estremi 0.4 (netto e asciutto) e 2.6 (tessuto).
      AUDIO.respiro = 0.4 * Math.pow(6.5, v / 100);
      return Tn("v.pct", v);
    });
    this.cursore("registro", (v) => {
      AUDIO.registro = v;
      return Tn("v.st", (v > 0 ? "+" : "") + v);
    });

    ["sereno", "vento", "volume", "riverbero", "voci", "sensibilita"]
      .forEach((id) => this.arco(id));

    this.lingue();

    this.righello();
    setInterval(() => this.aggiornaQuadrante(), 250);
  },

  /* La fila degli strumenti. Almeno uno deve restare acceso: spegnere l'ultimo
     non farebbe tacere l'insieme, lo lascerebbe senza timbro. */
  strumenti() {
    const cont = document.getElementById("scelta");
    const mostra = () => {
      [...cont.children].forEach((t, i) => {
        t.classList.toggle("acceso", AUDIO.strumenti[i]);
        t.setAttribute("aria-pressed", AUDIO.strumenti[i] ? "true" : "false");
        t.querySelector(".nomeStr").textContent = T("str." + STRUMENTI[i].chiave);
      });
    };
    STRUMENTI.forEach((st, i) => {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "tasto";
      t.innerHTML = '<span class="quadro"></span><span class="nomeStr"></span>';
      t.addEventListener("click", () => {
        const accesi = AUDIO.strumenti.filter(Boolean).length;
        if (AUDIO.strumenti[i] && accesi === 1) return;   // l'ultimo resta
        AUDIO.strumenti[i] = !AUDIO.strumenti[i];
        mostra();
      });
      cont.appendChild(t);
    });
    mostra();
    this.rinfresca.push(mostra);
  },

  /* Le quattro lingue. Il selettore sta in testata, sopra il filo; la scelta
     si conserva in `localStorage` e passa alla guida, che è una pagina a sé. */
  lingue() {
    const cont = document.getElementById("lingue");
    LINGUE.forEach((l) => {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.lang = l;
      b.textContent = SIGLA_LINGUA[l];
      b.addEventListener("click", () => this.cambiaLingua(l));
      cont.appendChild(b);
    });
    this.applicaLingua();
  },

  cambiaLingua(l) {
    if (!LINGUE.includes(l) || l === lingua) return;
    lingua = l;
    salvaLingua(l);
    this.applicaLingua();
  },

  /* Due attributi, non uno: `data-i18n` scrive testo semplice, `data-i18n-aria`
     l'etichetta che sente chi non vede. Poi si rieseguono i rinfreschi dei
     comandi, perché i loro valori sono frasi anch'essi ("15 s", "3 frasi"). */
  applicaLingua() {
    document.documentElement.lang = lingua;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = T(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
      el.setAttribute("aria-label", T(el.getAttribute("data-i18n-aria")));
    });
    const nav = document.getElementById("lingue");
    nav.setAttribute("aria-label", T("ui.lingua"));
    nav.querySelectorAll("button").forEach((b) => {
      const scelta = b.dataset.lang === lingua;
      b.classList.toggle("scelta", scelta);
      b.setAttribute("aria-pressed", scelta ? "true" : "false");
    });
    // il rimando alla guida porta con sé la lingua
    const g = document.querySelector("a.guida");
    if (g) g.setAttribute("href", "guida.html?lang=" + lingua);

    this.rinfresca.forEach((f) => f());
    this.aggiornaQuadrante();
  },

  /* Il righello: una casella per voce. Mostra la frase che la voce sta
     leggendo, e si accende quando la nuvola è sulla sua banda. */
  righello() {
    const cont = document.getElementById("righello");
    cont.style.gridTemplateColumns = "repeat(" + AUDIO.voci + ", 1fr)";
    cont.innerHTML = "";
    for (let i = 0; i < AUDIO.voci; i++) {
      const c = document.createElement("div");
      c.className = "banda";
      c.textContent = "·";
      cont.appendChild(c);
    }
  },

  aggiornaQuadrante() {
    const caselle = document.getElementById("righello").children;
    let inAscolto = 0;
    for (let i = 0; i < caselle.length; i++) {
      const v = Suono.voci[i];
      const viva = !!(v && v.frase && Suono.attivo);
      if (viva) inAscolto++;
      caselle[i].innerHTML = viva
        ? String(v.iFrase + 1).padStart(2, "0") +
          '<span class="strum">' + T("sig." + STRUMENTI[v.strumento].chiave) + "</span>"
        : "·";
      caselle[i].classList.toggle("attiva", viva);
    }
    const frase = document.getElementById("datoFrase");
    frase.innerHTML = (Suono.attivo ? String(Suono.fronte + 1).padStart(2, "0") : "—") +
      '<span class="piccolo">/' + FRASI.length + "</span>";
    document.getElementById("datoVoci").innerHTML =
      inAscolto + '<span class="piccolo">/' + AUDIO.voci + "</span>";
    document.getElementById("datoRegione").textContent =
      Suono.attivo ? regione(Suono.fronte) : "—";
  },
};

Cielo.init();
Pannello.init();
</script>
</body>
</html>
