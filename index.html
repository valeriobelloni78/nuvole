<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuvole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }
  body {
    /* Il fondo è ESATTAMENTE il colore dei puntini di cielo sereno, e piatto:
       così la matrice c'è ma non si vede, e affiorano solo i puntini bianchi
       delle nuvole. Un gradiente, anche lieve, la farebbe riapparire. */
    background: #5e9bc9;
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 5vw;
    min-height: 100vh;
  }

  /* La stanza: colonna allineata a sinistra */
  .stanza {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(14px, 2.2vh, 24px);
  }

  /* Tutta la parte tecnica è monospaziata: etichette, valori, quadranti. */
  .tecnico {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* Testata */
  .testata {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.38);
  }
  .marchio {
    font-weight: 300;
    letter-spacing: 0.5em;
    font-size: 13px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.95);
  }
  .sigla { color: rgba(255, 255, 255, 0.7); }

  /* La finestra: solo vetro, nessuna cornice */
  /* La finestra: un contorno finissimo, il solo segno che la incornicia */
  .finestra {
    line-height: 0;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }
  #cielo { display: block; width: 100%; }

  /* Righello delle bande: una casella per voce, il numero della frase che
     sta leggendo. È il riscontro visivo del legame nuvola -> voce. */
  .righello {
    display: grid;
    gap: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.38);
  }
  .banda {
    padding: 6px 0 0 0;
    border-right: 1px solid rgba(255, 255, 255, 0.22);
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    transition: color 0.25s ease;
    position: relative;
  }
  .banda:last-child { border-right: none; }
  .banda::before {
    content: "";
    position: absolute;
    left: 0; top: -1px;
    width: 0; height: 2px;
    background: #ffffff;
    transition: width 0.4s ease;
  }
  .banda.attiva { color: #ffffff; }
  .banda.attiva::before { width: 100%; }
  .righello.nascosto { display: none; }

  /* Quadrante dei dati */
  .quadrante {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid rgba(255, 255, 255, 0.38);
    border-bottom: 1px solid rgba(255, 255, 255, 0.38);
  }
  .dato {
    padding: 12px 16px 12px 0;
    border-right: 1px solid rgba(255, 255, 255, 0.22);
  }
  .dato:last-child { border-right: none; }
  .dato .cifra {
    font-size: 26px;
    letter-spacing: 0.02em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    text-transform: none;
  }
  .dato .cifra .piccolo { font-size: 12px; color: rgba(255, 255, 255, 0.65); }
  .dato .didascalia { color: rgba(255, 255, 255, 0.7); margin-top: 5px; }

  /* Sezioni di comandi */
  .sezione { display: flex; flex-direction: column; gap: 16px; }
  .rubrica {
    display: flex;
    align-items: center;
    gap: 12px;
    color: rgba(255, 255, 255, 0.85);
  }
  .rubrica .filo { flex: 1; height: 1px; background: rgba(255, 255, 255, 0.38); }
  .rubrica .codice { color: rgba(255, 255, 255, 0.6); letter-spacing: 0.1em; }

  .griglia {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(186px, 1fr));
    gap: 18px 34px;
  }
  .controllo { display: flex; flex-direction: column; gap: 9px; }
  .controllo > label {
    color: rgba(255, 255, 255, 0.75);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .controllo .valore {
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
  }

  /* Quadrante ad arco: tacche in cerchio, pallino pieno, targa sotto.
     Sotto il disegno resta un input[range] nativo, celato ma non rimosso:
     è lui a tenere il valore, e con lui restano tastiera e accessibilità. */
  .griglia.archi {
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 10px 24px;
  }
  .controllo.arco { align-items: center; gap: 2px; position: relative; }
  .disco { width: 100%; max-width: 152px; }
  .disco svg {
    display: block; width: 100%; height: auto; overflow: visible;
    touch-action: none;                 /* il trascinamento muove il pallino,
                                           non fa scorrere la pagina */
    -webkit-tap-highlight-color: transparent;
  }
  .disco .tacca { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.1; }
  .disco .pallino { fill: #ffffff; }
  .targa { text-align: center; }
  .targa .nome { color: rgba(255, 255, 255, 0.75); }
  .targa .lettura {
    font-size: 20px;
    letter-spacing: 0.02em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-transform: none;
    line-height: 1.2;
    margin-top: 3px;
  }
  .controllo.arco:focus-within .pallino {
    stroke: rgba(255, 255, 255, 0.55);
    stroke-width: 4;
  }

  /* Cursore: filetto con tacche e pallino pieno.
     La linea e le tacche sono SFONDI DELL'INPUT (due gradienti), non elementi
     disegnati sopra di esso — come in Rada. È la differenza fra un comando che
     risponde e uno che non risponde: con gli pseudo-elementi in `position:
     absolute` sul contenitore, `::after` viene dipinto dopo il contenuto e
     copre la metà inferiore del cursore, pallino compreso, intercettando il
     puntatore. Misurato: `elementFromPoint` non trovava più l'input da metà
     altezza in giù. Qui non c'è nulla sopra l'input, e tutta l'area risponde. */
  .cursore { position: relative; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 18px;
    margin: 0;
    background:
      linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45))
        0 8px / 100% 1px no-repeat,
      repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.35) 0 1px, transparent 1px 10%)
        0 9px / 100% 4px no-repeat;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 18px; background: transparent; border: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 9px; height: 9px;
    margin-top: 4.5px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 18px; background: transparent; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    cursor: pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
  }

  /* L'input che sta sotto un quadrante ad arco: resta nel DOM (tiene il valore
     e la tastiera) ma non si vede e non intercetta nulla. La specificità deve
     superare quella di `input[type="range"]`, altrimenti torna visibile. */
  input[type="range"].celato {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0;
    background: none;
    opacity: 0;
    pointer-events: none;
  }

  /* Interruttore: quadretto pieno/vuoto + stato */
  .interruttore {
    font: inherit;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffffff;
    background: transparent;
    border: none;
    padding: 0;
    height: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .interruttore .quadro {
    width: 9px; height: 9px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    background: transparent;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .interruttore:hover .quadro { border-color: #ffffff; }
  .interruttore .stato { color: rgba(255, 255, 255, 0.6); }
  .interruttore.acceso .quadro { background: #ffffff; border-color: #ffffff; }
  .interruttore.acceso .stato { color: #ffffff; }
</style>
</head>
<body>

  <div class="stanza">

    <div class="testata">
      <div class="marchio">Nuvole</div>
      <div class="sigla tecnico">53 frasi in Do · A:2</div>
    </div>

    <div class="finestra">
      <canvas id="cielo"></canvas>
    </div>

    <div class="righello tecnico" id="righello"></div>

    <div class="quadrante tecnico">
      <div class="dato">
        <div class="cifra" id="datoFrase">—<span class="piccolo">/53</span></div>
        <div class="didascalia">Frase dell'insieme</div>
      </div>
      <div class="dato">
        <div class="cifra" id="datoVoci">0<span class="piccolo">/6</span></div>
        <div class="didascalia">Voci in ascolto</div>
      </div>
      <div class="dato">
        <div class="cifra" id="datoRegione">Do</div>
        <div class="didascalia">Regione dell'arco</div>
      </div>
    </div>

    <div class="sezione">
      <div class="rubrica tecnico">
        <span>Cielo</span><span class="filo"></span><span class="codice">M1</span>
      </div>

      <div class="griglia archi tecnico">
        <div class="controllo arco">
          <div class="disco" id="discoSereno"></div>
          <div class="targa">
            <div class="nome">Cielo sereno</div>
            <div class="lettura" id="valSereno"></div>
          </div>
          <input type="range" id="sereno" min="0" max="100" value="30" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoVento"></div>
          <div class="targa">
            <div class="nome">Vento</div>
            <div class="lettura" id="valVento"></div>
          </div>
          <input type="range" id="vento" min="0" max="100" value="36" class="celato">
        </div>
      </div>

      <div class="griglia tecnico">
        <div class="controllo">
          <label>Grana <span class="valore" id="valGrana"></span></label>
          <div class="cursore"><input type="range" id="grana" min="5" max="20" value="9"></div>
        </div>
        <div class="controllo">
          <label>Ampiezza nuvole <span class="valore" id="valAmpiezza"></span></label>
          <div class="cursore"><input type="range" id="ampiezza" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label>Muta <span class="valore" id="valMuta"></span></label>
          <div class="cursore"><input type="range" id="muta" min="0" max="100" value="40"></div>
        </div>
        <div class="controllo">
          <label>Bande <span class="valore">righello</span></label>
          <button class="interruttore acceso" id="swBande" type="button" aria-pressed="true">
            <span class="quadro"></span><span class="stato">Visibili</span>
          </button>
        </div>
      </div>
    </div>

    <div class="sezione">
      <div class="rubrica tecnico">
        <span>Suono</span><span class="filo"></span><span class="codice">M2</span>
      </div>

      <div class="griglia tecnico">
        <div class="controllo">
          <label>Ascolto <span class="valore" id="valAscolto">fermo</span></label>
          <button class="interruttore" id="swAscolto" type="button" aria-pressed="false">
            <span class="quadro"></span><span class="stato">Silenzio</span>
          </button>
        </div>
        <div class="controllo">
          <label>Polso udibile <span class="valore">battito</span></label>
          <button class="interruttore" id="swPolso" type="button" aria-pressed="false">
            <span class="quadro"></span><span class="stato">Spento</span>
          </button>
        </div>
      </div>

      <div class="griglia archi tecnico">
        <div class="controllo arco">
          <div class="disco" id="discoVolume"></div>
          <div class="targa">
            <div class="nome">Volume</div>
            <div class="lettura" id="valVolume"></div>
          </div>
          <input type="range" id="volume" min="0" max="100" value="55" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoTempo"></div>
          <div class="targa">
            <div class="nome">Tempo</div>
            <div class="lettura" id="valTempo"></div>
          </div>
          <input type="range" id="tempo" min="44" max="132" value="88" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoVoci"></div>
          <div class="targa">
            <div class="nome">Voci</div>
            <div class="lettura" id="valVoci"></div>
          </div>
          <input type="range" id="voci" min="1" max="10" value="6" class="celato">
        </div>
        <div class="controllo arco">
          <div class="disco" id="discoSensibilita"></div>
          <div class="targa">
            <div class="nome">Sensibilità</div>
            <div class="lettura" id="valSensibilita"></div>
          </div>
          <input type="range" id="sensibilita" min="0" max="100" value="64" class="celato">
        </div>
      </div>

      <div class="griglia tecnico">
        <div class="controllo">
          <label>Dispersione <span class="valore" id="valDispersione"></span></label>
          <div class="cursore"><input type="range" id="dispersione" min="1" max="4" value="3"></div>
        </div>
        <div class="controllo">
          <label>Avanzamento <span class="valore" id="valAvanzamento"></span></label>
          <div class="cursore"><input type="range" id="avanzamento" min="0" max="100" value="50"></div>
        </div>
        <div class="controllo">
          <label>Riverbero <span class="valore" id="valRiverbero"></span></label>
          <div class="cursore"><input type="range" id="riverbero" min="0" max="100" value="38"></div>
        </div>
        <div class="controllo">
          <label>Registro <span class="valore" id="valRegistro"></span></label>
          <div class="cursore"><input type="range" id="registro" min="-12" max="12" value="0"></div>
        </div>
      </div>
    </div>

  </div>

<script>
"use strict";

/* =========================================================================
   NUVOLE — web-app di musica generativa (nella scia di Rada)
   Modulo 1 · Il cielo:  finestra con matrice di puntini + campo-nuvole a deriva.
   Modulo 2 · Il suono:  53 frasi in Do scelte dalle nuvole che attraversano.

   Architettura pensata per l'estensione futura:
   - PARAMS       : parametri di resa e comportamento, modificabili a runtime.
   - CampoNuvole  : il modello del cielo (rumore fBm con vento). Lo stesso campo
                    che disegna la finestra è letto dal motore audio come
                    partitura: una nuvola che attraversa una banda = una voce.
   - Cielo        : la matrice di puntini e il loop di rendering nella finestra.
   - FRASI        : l'archivio delle 53 frasi in Do.
   - Suono        : il motore generativo (Web Audio, nessuna libreria).
   ========================================================================= */

/* ------------------------------------------------------------------ */
/*  Parametri (alcuni pilotati dal pannello)                          */
/* ------------------------------------------------------------------ */
const PARAMS = {
  // Griglia
  passo:        9,      // distanza fra i puntini (px, coordinate CSS)
  passoRif:     22,     // passo di riferimento: le scale del rumore e la
                        // velocita' del vento sono tarate su questo, e vengono
                        // riportate al passo reale, cosi' infittire la matrice
                        // non rimpicciolisce le nuvole ne' le rallenta.
  raggioBase:   1.1,    // raggio del puntino di cielo sereno (invisibile)
  raggioNuvola: 2.6,    // raggio del puntino dentro la nuvola: cresce, perche'
                        // ora la nuvola e' la figura e non il vuoto

  // I due colori del puntino: cielo sereno -> nuvola.
  // ATTENZIONE: `celeste` deve restare identico al fondo della pagina (#5e9bc9),
  // altrimenti la matrice del cielo sereno riaffiora. Il canvas non ha fondo
  // proprio: i puntini stanno direttamente sul cielo della stanza, e si vedono
  // solo quelli che la nuvola ha sbiancato.
  celeste: { r: 94, g: 155, b: 201 },
  nuvola:  { r: 255, g: 255, b: 255 },

  // Campo-nuvole
  scalaForma:   0.075,  // dettaglio delle nuvole
  scalaMassa:   0.020,  // scala della copertura d'insieme
  soglia:       0.150,  // sotto questa densità: cielo sereno  (<- "cielo sereno")
  ampiezza:     0.065,  // ampiezza della transizione sereno -> nuvola

  // Deriva (vento)
  ventoX:       0.9,    // velocità orizzontale               (<- "vento")
  ventoY:       0.16,   // lieve deriva verticale
  morphMassa:   0.012,  // lentezza con cui la copertura muta

  glow:         false,  // su fondo chiaro un alone bianco non aggiunge nulla
};

/* Quanto vale un passo di griglia rispetto al passo di riferimento:
   converte scale del rumore e velocita' del vento da "unita' di riferimento"
   a colonne/righe della matrice reale. */
function fattoreGriglia() { return PARAMS.passo / PARAMS.passoRif; }

/* ------------------------------------------------------------------ */
/*  Rumore: value-noise 2D + fBm                                       */
/* ------------------------------------------------------------------ */
function hash2(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) | 0;
  n = (n * 1274126177) | 0;
  n = (n ^ (n >> 16)) >>> 0;
  return n / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const tl = hash2(xi,     yi);
  const tr = hash2(xi + 1, yi);
  const bl = hash2(xi,     yi + 1);
  const br = hash2(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  const top = tl + (tr - tl) * u;
  const bot = bl + (br - bl) * u;
  return top + (bot - top) * v;
}

function fbm(x, y) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < 4; i++) {
    sum  += amp * valueNoise(x * freq, y * freq);
    norm += amp;
    amp  *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ------------------------------------------------------------------ */
/*  Campo-nuvole                                                       */
/* ------------------------------------------------------------------ */
const CampoNuvole = {
  // dx, dy: fase di deriva accumulata (non tempo assoluto, così il vento
  // ne cambia il ritmo e non fa saltare le nuvole); tm: tempo per la muta.
  densita(col, row, dx, dy, tm) {
    const k = fattoreGriglia();
    const sForma = PARAMS.scalaForma * k;
    const sMassa = PARAMS.scalaMassa * k;
    const forma = fbm(
      (col - dx) * sForma,
      (row - dy) * sForma
    );
    const massa = fbm(
      (col - dx * 0.35) * sMassa + 100,
      (row) * sMassa + tm * PARAMS.morphMassa + 100
    );

    const densita = forma * (0.35 + massa * 0.95);
    return smoothstep(PARAMS.soglia, PARAMS.soglia + PARAMS.ampiezza, densita);
  }
};

/* ------------------------------------------------------------------ */
/*  Cielo: matrice + rendering nella finestra                         */
/* ------------------------------------------------------------------ */
const Cielo = {
  canvas: null, ctx: null, cornice: null,
  dpr: 1, w: 0, h: 0,
  cols: 0, rows: 0, offX: 0, offY: 0,
  lastTs: 0, phaseX: 0, phaseY: 0, tempo: 0,

  init() {
    this.canvas = document.getElementById("cielo");
    this.ctx = this.canvas.getContext("2d");
    this.cornice = document.querySelector(".finestra");
    this.resize();
    window.addEventListener("resize", () => this.resize());
    this.lastTs = performance.now();
    requestAnimationFrame((ts) => this.loop(ts));
  },

  // Dimensiona la finestra in modo responsive, lasciando spazio ai controlli
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);

    const maxW = this.cornice.clientWidth || window.innerWidth;
    const maxH = window.innerHeight * 0.60;
    let cw = maxW, ch = cw * 0.62;
    if (ch > maxH) { ch = maxH; }
    cw = Math.round(cw); ch = Math.round(ch);

    this.w = cw; this.h = ch;
    this.canvas.style.width  = cw + "px";
    this.canvas.style.height = ch + "px";
    this.canvas.width  = Math.floor(cw * this.dpr);
    this.canvas.height = Math.floor(ch * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    this.cols = Math.floor((cw - PARAMS.passo) / PARAMS.passo) + 1;
    this.rows = Math.floor((ch - PARAMS.passo) / PARAMS.passo) + 1;
    const larghGriglia = (this.cols - 1) * PARAMS.passo;
    const altGriglia   = (this.rows - 1) * PARAMS.passo;
    this.offX = (cw - larghGriglia) / 2;
    this.offY = (ch - altGriglia) / 2;
  },

  loop(ts) {
    let dt = (ts - this.lastTs) / 1000;
    this.lastTs = ts;
    if (!(dt >= 0) || dt > 0.25) dt = 0.016; // clamp (tab in background / primo frame)
    const k = 1 / fattoreGriglia();   // colonne al secondo alla densita' reale
    this.phaseX += PARAMS.ventoX * k * dt;
    this.phaseY += PARAMS.ventoY * k * dt;
    this.tempo  += dt;
    this.render();
    requestAnimationFrame((ts2) => this.loop(ts2));
  },

  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    const { celeste, nuvola, passo, raggioBase, raggioNuvola } = PARAMS;
    const dx = this.phaseX, dy = this.phaseY, tm = this.tempo;

    for (let r = 0; r < this.rows; r++) {
      const py = this.offY + r * passo;
      for (let c = 0; c < this.cols; c++) {
        const px = this.offX + c * passo;
        const q = CampoNuvole.densita(c, r, dx, dy, tm);

        const cr = Math.round(celeste.r + (nuvola.r - celeste.r) * q);
        const cg = Math.round(celeste.g + (nuvola.g - celeste.g) * q);
        const cb = Math.round(celeste.b + (nuvola.b - celeste.b) * q);
        const raggio = raggioBase + (raggioNuvola - raggioBase) * q;

        if (PARAMS.glow && q > 0.45) {
          ctx.shadowBlur = 4 * q;
          ctx.shadowColor = "rgba(255,255,255," + (0.55 * q).toFixed(3) + ")";
        } else {
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.fillStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        ctx.arc(px, py, raggio, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }
};

/* ------------------------------------------------------------------ */
/*  Archivio: 53 frasi in Do                                           */
/* ------------------------------------------------------------------ */
/* Ogni frase è una sequenza di eventi [semitoni da Do, durata in battiti];
   nota null = silenzio. Le frasi sono brevi, ripetibili, tutte in Do.

   NOTA. Questo archivio è ORIGINALE. Non riproduce le 53 cellule di "In C"
   di Terry Riley (1964), che sono opera sotto diritto d'autore: ne adotta
   il principio — cellule minime che ogni voce ripete a piacere, e un arco
   armonico che si sposta lentamente da una regione all'altra.

   LE CERNIERE. Più voci suonano insieme frasi diverse e vicine: la campata
   effettiva è la finestra di scelta (AUDIO.finestra) più una frase, perché
   una voce può star finendo la frase presa prima che il fronte avanzasse.
   Perciò due regioni confinanti non possono contenere lo stesso grado in due
   forme (Fa/Fa#, Mi/Mib, Si/Sib, La/Sib, Re/Mib): si scontrerebbero. Fra una
   regione e l'altra c'è quindi una CERNIERA di quattro frasi costruita sui
   soli suoni comuni, dove il grado vecchio si ritira prima che entri il nuovo.
   Verificato: nessuno scontro cromatico in alcuna finestra di 5 frasi
   consecutive, giro di boa 53->1 compreso. Se si cambia una frase, ricontrollare.

   L'arco, in dieci tratti:
      1-6    Do puro (Do-Mi-Sol)
      7-13   apertura pentatonica (Re, La)
     14-18   entra il Fa
     19-22   cerniera: il Fa si ritira
     23-29   il Fa#: la luce lidia
     30-34   regione di dominante (Si)
     35-38   cerniera: la quinta vuota, restano Do e Sol
     39-45   l'ombra (Mi bemolle, Si bemolle)
     46-49   cerniera: l'ombra si ritira (Do, Fa, Sol)
     50-53   rientro: tornano Mi e Si
   La 53 chiude su un Do lungo e il fronte torna alla 1: l'arco si richiude
   dove è cominciato. */
const FRASI = [
  /* I · Do puro — Do Mi Sol (1-6) ------------------------------- */
  [[4, 0.5], [null, 1.5]],
  [[4, 0.5], [7, 0.5], [null, 1]],
  [[0, 1], [4, 1]],
  [[7, 0.5], [4, 0.5], [0, 1]],
  [[4, 0.25], [7, 0.25], [4, 0.5], [null, 1]],
  [[0, 0.5], [4, 0.5], [7, 0.5], [12, 0.5]],

  /* II · apertura pentatonica — entrano Re e La (7-13) ---------- */
  [[9, 0.5], [7, 0.5], [4, 1]],
  [[2, 0.5], [4, 0.5], [7, 1]],
  [[12, 0.5], [9, 0.5], [7, 0.5], [4, 0.5]],
  [[7, 2], [9, 1]],
  [[4, 0.25], [2, 0.25], [0, 0.5], [null, 1]],
  [[9, 1], [12, 1]],
  [[0, 3]],

  /* III · il Fa (14-18) ----------------------------------------- */
  [[5, 0.5], [4, 0.5], [null, 1]],
  [[5, 1], [7, 1]],
  [[0, 0.5], [5, 0.5], [9, 1]],
  [[17, 0.5], [16, 0.5], [12, 1]],
  [[5, 0.25], [7, 0.25], [9, 0.5], [7, 1]],

  /* IV · cerniera — il Fa si ritira, resta la pentatonica (19-22) */
  [[12, 1], [9, 1], [7, 2]],
  [[2, 0.5], [4, 0.5], [2, 0.5], [0, 0.5]],
  [[7, 0.25], [9, 0.25], [12, 0.5], [null, 1]],
  [[14, 2], [12, 2]],

  /* V · il Fa# — la luce lidia (23-29) -------------------------- */
  [[6, 0.5], [7, 0.5], [null, 1]],
  [[7, 0.5], [6, 0.5], [4, 1]],
  [[2, 0.5], [6, 0.5], [7, 1]],
  [[14, 0.5], [12, 0.5], [7, 1]],
  [[6, 0.25], [7, 0.25], [9, 0.25], [7, 0.25], [null, 1]],
  [[19, 1], [18, 1]],
  [[6, 1], [9, 1], [7, 2]],

  /* VI · regione di dominante — entra il Si (30-34) ------------- */
  [[11, 0.5], [12, 0.5], [null, 1]],
  [[7, 0.5], [11, 0.5], [14, 1]],
  [[11, 0.25], [9, 0.25], [7, 0.5], [null, 1]],
  [[7, 0.25], [9, 0.25], [11, 0.25], [12, 0.25], [14, 1]],
  [[11, 3]],

  /* VII · cerniera — la quinta vuota: restano solo Do e Sol,
     il cielo si svuota prima dell'ombra (35-38) ----------------- */
  [[7, 2]],
  [[0, 1], [7, 1]],
  [[12, 0.5], [7, 0.5], [0, 1]],
  [[0, 3], [null, 1]],

  /* VIII · l'ombra — Mi bemolle e Si bemolle (39-45) ------------ */
  [[10, 0.5], [7, 0.5], [null, 1]],
  [[3, 1], [5, 1]],
  [[10, 0.5], [7, 0.5], [3, 1]],
  [[15, 0.5], [12, 0.5], [10, 1]],
  [[3, 0.25], [5, 0.25], [7, 0.5], [10, 1]],
  [[10, 2], [7, 2]],
  [[5, 1], [3, 1], [0, 2]],

  /* IX · cerniera — l'ombra si ritira: Do, Fa, Sol (46-49) ------ */
  [[5, 1], [7, 1]],
  [[12, 0.5], [7, 0.5], [5, 1]],
  [[0, 2], [7, 2]],
  [[0, 4]],

  /* X · rientro — tornano Mi e Si, e l'arco si chiude (50-53) --- */
  [[7, 1], [11, 1], [12, 2]],
  [[16, 2], [12, 2]],
  [[2, 0.5], [4, 0.5], [7, 1], [12, 2]],
  [[12, 0.5], [11, 0.5], [12, 6]],
];

/* Le sette regioni dell'arco, per il quadrante dei dati. */
const REGIONI = [
  { da:  0, nome: "Do" },
  { da:  6, nome: "Pentatonica" },
  { da: 13, nome: "Fa" },
  { da: 18, nome: "Cerniera" },
  { da: 22, nome: "Fa# lidio" },
  { da: 29, nome: "Dominante" },
  { da: 34, nome: "Quinta vuota" },
  { da: 38, nome: "Ombra" },
  { da: 45, nome: "Cerniera" },
  { da: 49, nome: "Rientro" },
];
function regione(i) {
  let n = REGIONI[0].nome;
  for (const r of REGIONI) if (i >= r.da) n = r.nome;
  return n;
}

/* ------------------------------------------------------------------ */
/*  Parametri del suono                                                */
/* ------------------------------------------------------------------ */
const AUDIO = {
  bpm:            88,    // il polso: tutte le voci condividono questa griglia
  voci:            6,    // quante voci (bande verticali della finestra)
  entra:        0.12,    // copertura di nuvola oltre cui una voce si sveglia
  esce:         0.05,    // copertura sotto cui la voce si congeda
  finestra:        3,    // quante frasi attorno al fronte sono scegliibili
  lettureMin:      2,    // ripetizioni minime di una frase
  lettureMax:      5,    // ripetizioni massime
  lettureFronte:   6,    // letture d'insieme che fanno avanzare il fronte
  attesaFronte:   15,    // ...ma non più spesso di così (secondi)
  registro:        0,    // trasporto d'insieme, in semitoni
  polso:       false,    // il battito udibile (in "In C" è ciò che tiene insieme)
  volume:       0.55,
  attacco:      0.09,
  rilascio:     0.85,
  riverbero:    0.38,
};

/* ------------------------------------------------------------------ */
/*  Suono: le nuvole scelgono le frasi                                 */
/* ------------------------------------------------------------------ */
/* Ogni voce presidia una banda verticale della finestra. Quando una nuvola
   entra nella sua banda la voce si sveglia, sceglie a caso una frase nella
   finestra corrente dell'archivio e la ripete; quando la nuvola esce, la
   voce finisce la lettura e tace. Poiché le nuvole attraversano le bande in
   momenti diversi, le voci entrano e escono senza accordarsi: le
   sovrapposizioni non sono scritte da nessuna parte.

   Dell'"In C" restano tre regole: il polso condiviso (le frasi partono tutte
   su un battito, ma hanno lunghezze diverse e quindi sfasano), l'archivio
   percorso in avanti e mai a salti (il "fronte" avanza di una frase alla
   volta), e la libertà di ciascuna voce dentro un intorno ristretto del
   fronte — così l'insieme resta in una stessa regione armonica senza mai
   ripetere la stessa combinazione. */
const Suono = {
  ctx: null, master: null, convolutore: null, invio: null,
  voci: [], timer: null, attivo: false,
  fronte: 0, letture: 0, ultimoPasso: 0, tDensita: 0, tPolso: 0,

  battito() { return 60 / AUDIO.bpm; },

  /* --- catena audio ------------------------------------------------ */
  creaContesto() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0;               // si apre in dissolvenza
    this.master.connect(this.ctx.destination);

    // Riverbero: risposta all'impulso generata, nessun file esterno.
    this.convolutore = this.ctx.createConvolver();
    this.convolutore.buffer = this.rispostaImpulso(3.4, 2.4);
    this.invio = this.ctx.createGain();
    this.invio.gain.value = AUDIO.riverbero;
    this.invio.connect(this.convolutore);
    this.convolutore.connect(this.master);
  },

  rispostaImpulso(secondi, decadimento) {
    const sr = this.ctx.sampleRate;
    const n = Math.floor(sr * secondi);
    const buf = this.ctx.createBuffer(2, n, sr);
    for (let ch = 0; ch < 2; ch++) {
      const dati = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) {
        dati[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decadimento);
      }
    }
    return buf;
  },

  /* --- le voci ----------------------------------------------------- */
  creaVoci() {
    const registri = [-12, 0, 12, 0, -12, 12];
    const timbri   = ["sine", "triangle"];
    this.voci = [];
    for (let i = 0; i < AUDIO.voci; i++) {
      const a = i / AUDIO.voci, b = (i + 1) / AUDIO.voci;
      const pan = this.ctx.createStereoPanner
        ? this.ctx.createStereoPanner() : null;
      if (pan) pan.pan.value = ((a + b) / 2) * 2 - 1;   // la banda dà la posizione
      const uscita = this.ctx.createGain();
      uscita.gain.value = 1;
      uscita.connect(pan || this.master);
      if (pan) { pan.connect(this.master); pan.connect(this.invio); }
      else uscita.connect(this.invio);

      this.voci.push({
        banda: [a, b],
        ottava: registri[i % registri.length],
        timbro: timbri[i % timbri.length],
        uscita: uscita, pan: pan,
        densita: 0, copertura: 0,
        frase: null, indice: 0, letture: 0, max: 0,
        tProssimo: 0,
      });
    }
  },

  /* Cambiare il numero di voci ridisegna le bande. I nodi vecchi restano
     collegati ancora due secondi, il tempo che le note in corso si spengano:
     staccarli subito darebbe uno scatto. */
  impostaVoci(n) {
    AUDIO.voci = n;
    if (!this.ctx) return;
    const vecchie = this.voci;
    this.creaVoci();
    const t = this.ctx.currentTime + 0.3;
    this.voci.forEach(v => { v.tProssimo = t; });
    setTimeout(() => vecchie.forEach(v => {
      try { v.uscita.disconnect(); if (v.pan) v.pan.disconnect(); } catch (e) {}
    }), 2000);
  },

  /* --- lettura del cielo sulla banda di ciascuna voce ---------------- */
  /* Il campo che disegna la finestra è letto qui come partitura, a grana
     grossa e non più di dieci volte al secondo. Se ne ricavano due misure:
       copertura — quanta parte della banda sta dentro una nuvola: è il
                   segnale di attacco e di congedo (la nuvola che arriva);
       densita   — la media, che governa dinamica e apertura del filtro.
     La copertura è preferita alla media perché la media di una banda alta e
     stretta resta sempre bassa, e al massimo perché il massimo satura a 1
     appena un solo punto è dentro una nuvola. Distribuzioni misurate sul
     campo reale (18 s, cielo al 45%): copertura p50 0-0.19, picchi 0.47. */
  aggiornaDensita(ora) {
    if (ora - this.tDensita < 0.1) return;
    this.tDensita = ora;
    const dx = Cielo.phaseX, dy = Cielo.phaseY, tm = Cielo.tempo;
    for (const v of this.voci) {
      const c0 = Math.floor(v.banda[0] * Cielo.cols);
      const c1 = Math.max(c0 + 1, Math.floor(v.banda[1] * Cielo.cols));
      let somma = 0, dentro = 0, n = 0;
      for (let c = c0; c < c1; c += 3) {
        for (let r = 0; r < Cielo.rows; r += 5) {
          const q = CampoNuvole.densita(c, r, dx, dy, tm);
          somma += q;
          if (q > 0.5) dentro++;
          n++;
        }
      }
      v.densita   = n ? somma / n : 0;
      v.copertura = n ? dentro / n : 0;
    }
  },

  /* --- l'archivio: fronte e scelta ---------------------------------- */

  /* Di quanto una voce è rimasta indietro rispetto al fronte (distanza
     circolare con segno: positiva = indietro, negativa = avanti). */
  ritardo(iFrase, fronte) {
    let d = (fronte - iFrase + FRASI.length) % FRASI.length;
    if (d > FRASI.length / 2) d -= FRASI.length;
    return d;
  },

  /* L'insieme non lascia indietro nessuno: il fronte avanza solo quando ogni
     voce che sta suonando è al massimo una frase dietro la nuova posizione.
     È la disciplina che in "In C" è affidata ai musicisti, ed è anche ciò che
     rende valida la garanzia dell'archivio: senza, una voce può trascinare una
     frase di sei posizioni più indietro e far scontrare Fa e Fa#. */
  avanzaFronte(ora) {
    if (ora - this.ultimoPasso < AUDIO.attesaFronte) return;
    const nuovo = (this.fronte + 1) % FRASI.length;
    for (const v of this.voci) {
      if (v.frase && this.ritardo(v.iFrase, nuovo) > 1) return;   // aspetta
    }
    this.ultimoPasso = ora;
    this.fronte = nuovo;
  },

  sveglia(v) {
    const scarto = Math.floor(Math.random() * AUDIO.finestra);
    v.iFrase = (this.fronte + scarto) % FRASI.length;
    v.frase = FRASI[v.iFrase];
    v.indice = 0;
    v.letture = 0;
    v.max = AUDIO.lettureMin +
            Math.floor(Math.random() * (AUDIO.lettureMax - AUDIO.lettureMin + 1));
  },

  congeda(v) {
    v.frase = null;
    v.indice = 0;
    v.letture = 0;
  },

  /* --- scheduler ---------------------------------------------------- */
  tick() {
    const ora = this.ctx.currentTime;
    const orizzonte = ora + 0.25;
    this.aggiornaDensita(ora);
    for (const v of this.voci) this.avanza(v, orizzonte, ora);
    this.avanzaPolso(orizzonte);
  },

  /* Il battito udibile: un Do acuto, brevissimo, sulla griglia comune.
     È la sola cosa che tiene insieme le voci; senza, l'insieme resta
     ugualmente in fase ma nessuno la sente. */
  avanzaPolso(orizzonte) {
    if (this.tPolso < this.ctx.currentTime) this.tPolso = this.ctx.currentTime + 0.05;
    let passi = 0;
    while (this.tPolso < orizzonte && passi++ < 32) {
      if (AUDIO.polso) this.battuta(this.tPolso);
      this.tPolso += this.battito();
    }
  },

  battuta(t) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 1046.5;            // Do, due ottave sopra
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.14);
    osc.onended = () => g.disconnect();
  },

  avanza(v, orizzonte, ora) {
    let passi = 0;
    while (v.tProssimo < orizzonte && passi++ < 64) {
      if (v.frase === null) {
        // In attesa: la voce resta sulla griglia del polso, in silenzio,
        // finché la nuvola non arriva sulla sua banda.
        if (v.copertura >= AUDIO.entra) this.sveglia(v);
        else { v.tProssimo += this.battito(); continue; }
      }

      const ev = v.frase[v.indice];
      if (ev[0] !== null) this.nota(v, ev[0], ev[1], v.tProssimo);
      v.tProssimo += ev[1] * this.battito();
      v.indice++;

      if (v.indice >= v.frase.length) {
        v.indice = 0;
        v.letture++;
        this.letture++;
        if (this.letture % AUDIO.lettureFronte === 0) this.avanzaFronte(ora);
        // Si congeda se la nuvola è passata, se ha finito le sue ripetizioni,
        // o se il fronte l'ha lasciata indietro (in tal caso, se la nuvola è
        // ancora sulla banda, al battito seguente sceglie una frase aggiornata).
        if (v.copertura < AUDIO.esce || v.letture >= v.max ||
            this.ritardo(v.iFrase, this.fronte) > 0) this.congeda(v);
      }
    }
  },

  /* --- una nota ------------------------------------------------------ */
  nota(v, semitoni, durata, t) {
    const ctx = this.ctx;
    const freq = 261.626 * Math.pow(2, (semitoni + v.ottava + AUDIO.registro) / 12);
    const dur = durata * this.battito();
    const tenuta = Math.max(0.12, dur * 0.82);
    const rilascio = AUDIO.rilascio;
    const amp = 0.13 * Math.min(1, 0.45 + v.densita * 1.8);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + AUDIO.attacco);
    g.gain.setValueAtTime(amp, t + tenuta);
    g.gain.exponentialRampToValueAtTime(0.0001, t + tenuta + rilascio);

    const filtro = ctx.createBiquadFilter();
    filtro.type = "lowpass";
    filtro.frequency.value = 900 + 4000 * v.densita;
    filtro.Q.value = 0.4;

    const osc = ctx.createOscillator();
    osc.type = v.timbro;
    osc.frequency.value = freq;

    // Un'ottava sopra, appena percettibile: dà corpo senza durezza.
    const armonico = ctx.createOscillator();
    armonico.type = "sine";
    armonico.frequency.value = freq * 2;
    const gArm = ctx.createGain();
    gArm.gain.value = 0.14;

    osc.connect(filtro);
    armonico.connect(gArm); gArm.connect(filtro);
    filtro.connect(g);
    g.connect(v.uscita);

    const fine = t + tenuta + rilascio + 0.05;
    osc.start(t); osc.stop(fine);
    armonico.start(t); armonico.stop(fine);
    osc.onended = () => { g.disconnect(); filtro.disconnect(); };
  },

  /* --- accensione e spegnimento -------------------------------------- */
  avvia() {
    if (!this.ctx) { this.creaContesto(); this.creaVoci(); }
    this.ctx.resume();
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(AUDIO.volume, t + 1.5);
    this.voci.forEach(v => { v.tProssimo = t + 0.3; this.congeda(v); });
    this.tPolso = t + 0.3;
    this.ultimoPasso = t;
    this.attivo = true;
    this.timer = setInterval(() => this.tick(), 25);
  },

  ferma() {
    if (!this.ctx) return;
    this.attivo = false;
    clearInterval(this.timer);
    this.timer = null;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => { if (!this.attivo) this.ctx.suspend(); }, 1500);
  },

  riverbero(v) {
    AUDIO.riverbero = v;
    if (this.invio) this.invio.gain.value = v;
  },

  volume(v) {
    AUDIO.volume = v;
    if (this.ctx && this.attivo) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value, t);
      this.master.gain.linearRampToValueAtTime(v, t + 0.15);
    }
  },
};

/* ------------------------------------------------------------------ */
/*  Pannello di controllo                                              */
/* ------------------------------------------------------------------ */
/* Ogni comando scrive in PARAMS (il cielo) o in AUDIO (il suono), e nient'altro:
   il pannello non conosce né il rendering né lo scheduler. */
const Pannello = {

  /* Un cursore: mappa 0..100 (o il proprio intervallo) sul parametro, e
     scrive l'etichetta del valore. */
  cursore(id, applica) {
    const el = document.getElementById(id);
    const val = document.getElementById("val" + id[0].toUpperCase() + id.slice(1));
    const agisci = () => { if (val) val.textContent = applica(+el.value); };
    el.addEventListener("input", agisci);
    agisci();
  },

  /* Un quadrante ad arco. Disegna le tacche e il pallino, e traduce il
     puntatore in valore dell'input nativo che gli sta sotto (`celato`), il
     quale resta la sorgente di verità: `cursore()` non sa che esiste l'arco.
     Geometria: centro (70,70), arco da 195° a -15°, tacche fra r=58 e r=66,
     pallino su r=46 — come nelle reference, il pallino corre dentro le tacche. */
  arco(id) {
    const NS = "http://www.w3.org/2000/svg";
    const CX = 70, CY = 70, A0 = 195, A1 = -15;
    const R_INT = 58, R_EST = 66, R_PAL = 46;

    const input = document.getElementById(id);
    const disco = document.getElementById("disco" + id[0].toUpperCase() + id.slice(1));
    const min = +input.min, max = +input.max;
    // Se la corsa è breve, una tacca per ogni scatto; altrimenti ventiquattro.
    const passi = (max - min) <= 12 ? (max - min) : 24;

    const punto = (t, r) => {
      const a = (A0 + (A1 - A0) * t) * Math.PI / 180;
      return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
    };

    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 140 92");
    svg.setAttribute("aria-hidden", "true");
    for (let i = 0; i <= passi; i++) {
      const t = i / passi;
      const [x1, y1] = punto(t, R_INT), [x2, y2] = punto(t, R_EST);
      const l = document.createElementNS(NS, "line");
      l.setAttribute("class", "tacca");
      l.setAttribute("x1", x1.toFixed(2)); l.setAttribute("y1", y1.toFixed(2));
      l.setAttribute("x2", x2.toFixed(2)); l.setAttribute("y2", y2.toFixed(2));
      svg.appendChild(l);
    }
    const pallino = document.createElementNS(NS, "circle");
    pallino.setAttribute("class", "pallino");
    pallino.setAttribute("r", "4.6");
    svg.appendChild(pallino);
    disco.appendChild(svg);

    const disegna = () => {
      const t = (+input.value - min) / (max - min);
      const [x, y] = punto(t, R_PAL);
      pallino.setAttribute("cx", x.toFixed(2));
      pallino.setAttribute("cy", y.toFixed(2));
    };

    // Dal puntatore all'angolo, e dall'angolo al valore. Sotto l'arco c'è un
    // settore morto di 150°: lì il puntatore va al capo più vicino.
    const daPuntatore = (ev) => {
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * 140;
      const y = (ev.clientY - r.top) / r.height * 92;
      let a = Math.atan2(CY - y, x - CX) * 180 / Math.PI;
      if (a < A0 - 360) a += 360;
      if (a < A1) a = (a > -90) ? A1 : A0;
      const t = Math.min(1, Math.max(0, (A0 - a) / (A0 - A1)));
      const v = Math.round(min + t * (max - min));
      if (v !== +input.value) {
        input.value = v;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }
    };

    svg.style.cursor = "pointer";
    svg.addEventListener("pointerdown", (ev) => {
      daPuntatore(ev);                 // prima il valore: se la cattura fallisce
      ev.preventDefault();             // (puntatore sintetico, browser vecchio),
      try {                            // il clic deve comunque valere
        svg.setPointerCapture(ev.pointerId);
        input.focus({ preventScroll: true });
      } catch (e) { /* si trascina lo stesso, senza cattura */ }
    });
    svg.addEventListener("pointermove", (ev) => {
      if (svg.hasPointerCapture(ev.pointerId)) daPuntatore(ev);
    });
    const rilascia = (ev) => {
      try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
    };
    svg.addEventListener("pointerup", rilascia);
    svg.addEventListener("pointercancel", rilascia);

    input.addEventListener("input", disegna);
    disegna();
  },

  /* Un interruttore: quadretto pieno/vuoto, due stati, due etichette. */
  interruttore(id, acceso, etichette, applica) {
    const el = document.getElementById(id);
    const stato = el.querySelector(".stato");
    let on = acceso;
    const mostra = () => {
      el.classList.toggle("acceso", on);
      el.setAttribute("aria-pressed", on ? "true" : "false");
      stato.textContent = on ? etichette[1] : etichette[0];
      applica(on);
    };
    el.addEventListener("click", () => { on = !on; mostra(); });
    mostra();
    return { leggi: () => on, scrivi: (v) => { on = v; mostra(); } };
  },

  init() {
    /* ---- Cielo ---- */
    this.cursore("sereno", (v) => {
      PARAMS.soglia = 0.10 + (v / 100) * (0.21 - 0.10);
      return v + "%";
    });
    this.cursore("vento", (v) => {
      PARAMS.ventoX = (v / 100) * 2.5;
      PARAMS.ventoY = PARAMS.ventoX * 0.18;
      return v + "%";
    });
    this.cursore("grana", (v) => {
      PARAMS.passo = v;                 // fattoreGriglia() tiene ferme le nuvole
      Cielo.resize();
      return v + " px";
    });
    this.cursore("ampiezza", (v) => {
      // Più alto = nuvole più larghe: la scala del rumore diminuisce. La corsa
      // si ferma a 0.035 perché più in là la nuvola supera la finestra: il campo
      // resta uniforme, il cielo non si copre mai e l'insieme ammutolisce.
      PARAMS.scalaForma = 0.115 - (v / 100) * 0.080;
      PARAMS.scalaMassa = PARAMS.scalaForma * 0.267;   // la massa segue la forma
      return v + "%";
    });
    this.cursore("muta", (v) => {
      PARAMS.morphMassa = (v / 100) * 0.030;
      return v + "%";
    });

    /* ---- Suono ---- */
    const valAscolto = document.getElementById("valAscolto");
    this.interruttore("swAscolto", false, ["Silenzio", "In ascolto"], (on) => {
      if (on === Suono.attivo) return;
      if (on) Suono.avvia(); else Suono.ferma();
      valAscolto.textContent = on ? "attivo" : "fermo";
    });
    this.interruttore("swPolso", false, ["Spento", "Acceso"], (on) => {
      AUDIO.polso = on;
    });
    this.interruttore("swBande", true, ["Nascoste", "Visibili"], (on) => {
      document.getElementById("righello").classList.toggle("nascosto", !on);
    });

    this.cursore("volume", (v) => { Suono.volume(v / 100); return v + "%"; });
    this.cursore("tempo", (v) => { AUDIO.bpm = v; return v + " bpm"; });
    this.cursore("voci", (v) => {
      if (v !== AUDIO.voci) { Suono.impostaVoci(v); this.righello(); }
      return v;
    });
    this.cursore("sensibilita", (v) => {
      // Più alta = basta poca nuvola per svegliare una voce.
      AUDIO.entra = 0.28 - (v / 100) * 0.25;
      AUDIO.esce  = AUDIO.entra * 0.4;
      return v + "%";
    });
    this.cursore("dispersione", (v) => {
      // La corsa si ferma a 4 perché l'archivio garantisce l'assenza di scontri
      // cromatici solo entro una campata di 5 frasi (4 di scelta + 1 di coda).
      AUDIO.finestra = v;
      return v + (v === 1 ? " frase" : " frasi");
    });
    this.cursore("avanzamento", (v) => {
      // Ogni quanto l'insieme può passare alla frase successiva.
      AUDIO.attesaFronte = 60 * Math.pow(0.06, v / 100);
      return Math.round(AUDIO.attesaFronte) + " s";
    });
    this.cursore("riverbero", (v) => { Suono.riverbero(v / 100); return v + "%"; });
    this.cursore("registro", (v) => {
      AUDIO.registro = v;
      return (v > 0 ? "+" : "") + v + " st";
    });

    ["sereno", "vento", "volume", "tempo", "voci", "sensibilita"]
      .forEach((id) => this.arco(id));

    this.righello();
    setInterval(() => this.aggiornaQuadrante(), 250);
  },

  /* Il righello: una casella per voce. Mostra la frase che la voce sta
     leggendo, e si accende quando la nuvola è sulla sua banda. */
  righello() {
    const cont = document.getElementById("righello");
    cont.style.gridTemplateColumns = "repeat(" + AUDIO.voci + ", 1fr)";
    cont.innerHTML = "";
    for (let i = 0; i < AUDIO.voci; i++) {
      const c = document.createElement("div");
      c.className = "banda";
      c.textContent = "·";
      cont.appendChild(c);
    }
  },

  aggiornaQuadrante() {
    const caselle = document.getElementById("righello").children;
    let inAscolto = 0;
    for (let i = 0; i < caselle.length; i++) {
      const v = Suono.voci[i];
      const viva = !!(v && v.frase && Suono.attivo);
      if (viva) inAscolto++;
      caselle[i].textContent = viva ? String(v.iFrase + 1).padStart(2, "0") : "·";
      caselle[i].classList.toggle("attiva", viva);
    }
    const frase = document.getElementById("datoFrase");
    frase.innerHTML = (Suono.attivo ? String(Suono.fronte + 1).padStart(2, "0") : "—") +
      '<span class="piccolo">/' + FRASI.length + "</span>";
    document.getElementById("datoVoci").innerHTML =
      inAscolto + '<span class="piccolo">/' + AUDIO.voci + "</span>";
    document.getElementById("datoRegione").textContent =
      Suono.attivo ? regione(Suono.fronte) : "—";
  },
};

Cielo.init();
Pannello.init();
</script>
</body>
</html>
