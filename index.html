<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nuvole</title>
<style>
  :root {
    /* Palette cielo — modificabile in un solo punto */
    --sky-top:    #08192f;
    --sky-bottom: #103458;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--sky-bottom);
  }
  #cielo {
    display: block;
    width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
    cursor: default;
  }
  /* Marchio discreto, si dissolve dopo l'avvio */
  #marchio {
    position: fixed;
    left: 24px; bottom: 20px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    letter-spacing: 0.42em;
    font-size: 13px;
    text-transform: uppercase;
    color: rgba(200, 226, 248, 0.75);
    pointer-events: none;
    user-select: none;
    transition: opacity 2.4s ease 3s;
  }
  #marchio.svanito { opacity: 0; }
</style>
</head>
<body>
  <canvas id="cielo"></canvas>
  <div id="marchio">Nuvole</div>

<script>
"use strict";

/* =========================================================================
   NUVOLE — web-app di musica generativa (nella scia di Rada)
   Modulo 1 · Il cielo: matrice di puntini + campo-nuvole a deriva animata.

   Architettura pensata per l'estensione futura:
   - PARAMS  : tutti i parametri di resa e di comportamento in un solo luogo.
   - CampoNuvole : il modello del cielo (rumore fBm con vento). È qui che, in
                   seguito, la densità delle nuvole potrà pilotare il motore
                   audio generativo (una nuvola che attraversa = un evento).
   - Cielo   : la matrice di puntini e il loop di rendering.
   ========================================================================= */

const PARAMS = {
  // Griglia
  passo:        22,     // distanza fra i puntini (px, in coordinate CSS)
  raggioBase:   2.4,    // raggio del puntino di cielo sereno
  raggioNuvola: 4.6,    // raggio massimo del puntino "nuvola"

  // Colori (cielo sereno -> nuvola)
  celeste: { r: 96,  g: 176, b: 232 },
  bianco:  { r: 255, g: 255, b: 255 },

  // Campo-nuvole
  scalaForma:   0.075,  // dettaglio delle nuvole (più alto = nuvole più piccole)
  scalaMassa:   0.020,  // scala della copertura d'insieme (dove il cielo è nuvoloso)
  soglia:       0.150,  // sotto questa densità: cielo sereno (tarata sul campo)
  ampiezza:     0.065,  // ampiezza della transizione sereno -> nuvola

  // Deriva (vento)
  ventoX:       0.9,    // velocità orizzontale del vento (px equivalenti / s)
  ventoY:       0.16,   // lieve deriva verticale
  morphMassa:   0.012,  // lentezza con cui la copertura d'insieme muta

  glow:         true,   // alone luminoso sui puntini-nuvola
};

/* ------------------------------------------------------------------ */
/*  Rumore: value-noise 2D + fBm (frazionario browniano)              */
/* ------------------------------------------------------------------ */
function hash2(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) | 0;
  n = (n * 1274126177) | 0;
  n = (n ^ (n >> 16)) >>> 0;
  return n / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const tl = hash2(xi,     yi);
  const tr = hash2(xi + 1, yi);
  const bl = hash2(xi,     yi + 1);
  const br = hash2(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  const top = tl + (tr - tl) * u;
  const bot = bl + (br - bl) * u;
  return top + (bot - top) * v;
}

function fbm(x, y) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < 4; i++) {
    sum  += amp * valueNoise(x * freq, y * freq);
    norm += amp;
    amp  *= 0.5;
    freq *= 2;
  }
  return sum / norm; // 0..1
}

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

/* ------------------------------------------------------------------ */
/*  Campo-nuvole: densità della nuvola in ogni punto, nel tempo       */
/* ------------------------------------------------------------------ */
const CampoNuvole = {
  // Restituisce la "quantità di nuvola" in (col,row) al tempo t (secondi): 0..1
  densita(col, row, t) {
    // Deriva: il campo scorre nel tempo -> le nuvole attraversano il cielo
    const dx = t * PARAMS.ventoX;
    const dy = t * PARAMS.ventoY;

    // Forma di dettaglio delle nuvole
    const forma = fbm(
      (col - dx) * PARAMS.scalaForma,
      (row - dy) * PARAMS.scalaForma
    );

    // Copertura d'insieme: modula dove, nel cielo, ci sono nuvole (muta lenta)
    const massa = fbm(
      (col - dx * 0.35) * PARAMS.scalaMassa + 100,
      (row) * PARAMS.scalaMassa + t * PARAMS.morphMassa + 100
    );

    // Le due scale si moltiplicano: nuvole nette dentro grandi banchi
    const densita = forma * (0.35 + massa * 0.95);

    return smoothstep(PARAMS.soglia, PARAMS.soglia + PARAMS.ampiezza, densita);
  }
};

/* ------------------------------------------------------------------ */
/*  Cielo: matrice di puntini + rendering                             */
/* ------------------------------------------------------------------ */
const Cielo = {
  canvas: null, ctx: null,
  dpr: 1, w: 0, h: 0,
  cols: 0, rows: 0, offX: 0, offY: 0,
  t0: 0,

  init() {
    this.canvas = document.getElementById("cielo");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", () => this.resize());
    this.t0 = performance.now();
    requestAnimationFrame((ts) => this.loop(ts));

    // Dissolvenza del marchio
    setTimeout(() => document.getElementById("marchio").classList.add("svanito"), 100);
  },

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.canvas.width  = Math.floor(this.w * this.dpr);
    this.canvas.height = Math.floor(this.h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

    // Numero di puntini e centratura della matrice
    this.cols = Math.ceil(this.w / PARAMS.passo) + 1;
    this.rows = Math.ceil(this.h / PARAMS.passo) + 1;
    const larghGriglia = (this.cols - 1) * PARAMS.passo;
    const altGriglia   = (this.rows - 1) * PARAMS.passo;
    this.offX = (this.w - larghGriglia) / 2;
    this.offY = (this.h - altGriglia) / 2;
  },

  loop(ts) {
    const t = (ts - this.t0) / 1000; // secondi
    this.render(t);
    requestAnimationFrame((ts2) => this.loop(ts2));
  },

  render(t) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    const { celeste, bianco, passo, raggioBase, raggioNuvola } = PARAMS;

    for (let r = 0; r < this.rows; r++) {
      const py = this.offY + r * passo;
      for (let c = 0; c < this.cols; c++) {
        const px = this.offX + c * passo;

        const q = CampoNuvole.densita(c, r, t); // 0..1

        // Colore: interpolazione celeste -> bianco
        const cr = Math.round(celeste.r + (bianco.r - celeste.r) * q);
        const cg = Math.round(celeste.g + (bianco.g - celeste.g) * q);
        const cb = Math.round(celeste.b + (bianco.b - celeste.b) * q);

        const raggio = raggioBase + (raggioNuvola - raggioBase) * q;

        if (PARAMS.glow && q > 0.05) {
          ctx.shadowBlur = 6 * q;
          ctx.shadowColor = "rgba(255,255,255," + (0.55 * q).toFixed(3) + ")";
        } else {
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.fillStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        ctx.arc(px, py, raggio, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }
};

Cielo.init();
</script>
</body>
</html>
